<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/Teaching-Materials/student-support/body-upgrade-mission/assets/favicon-B5J45_S7.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>open-slide</title>
    <style>
      html {
        background-color: oklch(0.99 0 0);
      }
      html.dark {
        background-color: oklch(0.145 0 0);
      }
    </style>
    <script>
      // Apply the stored theme before first paint; next-themes only runs
      // after the bundle loads, which flashes white for dark-mode users.
      let stored = null;
      try {
        stored = localStorage.getItem('theme');
      } catch (_) {}
      const dark =
        stored === 'dark' ||
        (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    </script>
    <script type="module" crossorigin src="/Teaching-Materials/student-support/body-upgrade-mission/assets/index-BcuLqzyI.js"></script>
    <link rel="stylesheet" crossorigin href="/Teaching-Materials/student-support/body-upgrade-mission/assets/index-GCZJDE85.css">
  </head>

  </body>
</html>

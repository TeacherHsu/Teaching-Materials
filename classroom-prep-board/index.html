  <style>

    :fullscreen .mode-switch,:fullscreen #exportBtn,:fullscreen #importBtn,:fullscreen #fullscreenBtn{display:none}:fullscreen .topbar{padding:14px 28px}:fullscreen main{padding-top:18px}:fullscreen .projection .hero{margin-bottom:16px}
    /* 投影端高易讀覆蓋樣式 */

    .topbar{background:#102a43}.brand h1{font-size:22px}.brand p{font-size:15px;color:#e3edf4}.projection .hero h2{font-weight:950}.projection .panel{border:2px solid var(--line);box-shadow:0 10px 26px rgba(16,42,67,.10)}.projection .panel-head{border-bottom:1px solid #d9e3e9}.projection .panel-head h3{color:#173b57}.projection .current-title{font-size:clamp(34px,5vw,64px);color:#0b344f;line-height:1.15}.projection .current-meta{margin-bottom:22px}.projection .tag{background:#e3ebf1;color:#173b57;border:1px solid #b7c9d5;font-weight:850}.projection .current-card>.check-title{color:#0b6870}.projection .flow>.check-title{color:#1d5f9d}.projection .prep-item{background:#e6f5f3;border:2px solid #83bdb9;color:#123d40}.projection .flow-step{background:#e7eff7;color:#183c5e;border:1px solid #b8cde0}.projection .flow-step.active{background:#cfe5fa;color:#104f89;outline:3px solid #73aadd}.projection .empty{color:#304b61;border-color:#aabfcd}.projection .countdown{background:#fff8ec;border-top:2px solid #e7c58d}.projection .countdown-value{color:#a54d00}.projection .notice-banner{border:2px solid #e0a84d;color:#733d00}.projection #nextPanel .panel-head h3{color:#7657a8}.projection #nextPanel .flow>.check-title{color:#7657a8}.projection .day-cell{background:#fff;color:#173b57;border-color:#b9c9d5;font-size:15px;line-height:1.35}.projection .day-cell.active{background:#d6efed;border-color:#55a7a2}.projection .day-name{font-size:16px;background:#dce7ed;color:#173b57}.editor{font-size:16px}.editor .cell input,.editor .cell textarea,.editor .settings input,.editor .settings-input{font-size:15px}.editor .cell small,.editor .settings label{font-size:14px;color:#304b61}

<body>
<div class="app">
  <header class="topbar"><div class="brand"><div class="brand-mark">準</div><div><h1>潛能教室｜課前準備看板</h1><p>看見下一節，先把準備做好</p></div></div><div class="top-actions"><button id="exportBtn">↓ 匯出設定</button><button id="importBtn">↑ 匯入設定</button><input id="importFile" type="file" accept="application/json" hidden><button id="fullscreenBtn">⛶ 全螢幕</button></div></header>
  <main>
    <div class="mode-switch"><button class="mode-btn active" data-mode="projection">投影看板</button><button class="mode-btn" data-mode="editor">教師編輯</button></div>
    <section class="projection" id="projectionView">
      <div class="hero"><div><div class="eyebrow" id="dateLine">115 學年度</div><h2 id="todayTitle">今天的課前準備</h2><p id="weekInfo">正在讀取課表……</p></div><div class="clock"><strong id="clock">--:--:--</strong><span id="clockDate">----</span></div></div>
      <div class="status-grid"><section class="panel" id="mainPanel"></section><section class="panel" id="nextPanel"></section></div>
      <section class="panel schedule-preview"><div class="panel-head"><h3>本週課表</h3><span class="pill" id="weekPill">—</span></div><div class="mini-grid" id="miniGrid"></div></section>
    </section>
    <section class="editor" id="editorView">
      <div class="hero"><div><div class="eyebrow">教師編輯端</div><h2>設定課表與課堂流程</h2><p>修改後儲存，投影看板會在這台裝置立即套用。</p></div></div>
      <section class="panel"><div class="panel-head"><h3>週次與顯示設定</h3><span class="pill">資料保存在本機瀏覽器</span></div><div class="settings"><label>第 1 週週一日期<input type="date" id="weekStart"></label><label>目前週次顯示<select id="parityMode" class="settings-input"><option value="auto">依日期自動判斷</option><option value="odd">固定奇數週</option><option value="even">固定偶數週</option></select></label><label>準備項目顯示<select id="prepDisplay" class="settings-input"><option value="hanzi-zhuyin">漢字＋注音</option><option value="hanzi">只顯示漢字</option><option value="zhuyin">只顯示注音</option></select></label><label>提前顯示下一節（分鐘）<input type="number" min="0" max="30" id="leadMinutes"></label></div></section>
      <section class="panel" style="margin-top:20px"><div class="panel-head"><h3>每週課表與準備項目</h3><span class="notice">同一格可填寫不同週次的教材</span></div><div class="editor-grid"><table class="editor-table"><thead><tr><th>課節／時間</th><th>星期一</th><th>星期二</th><th>星期三</th><th>星期四</th><th>星期五</th></tr></thead><tbody id="editorBody"></tbody></table></div><div class="editor-footer"><span class="notice">每格可填：課程、準備物品、課堂流程。空白格代表無課。</span><div><button class="secondary" id="resetBtn">恢復範例資料</button> <button class="primary" id="saveBtn">儲存設定</button></div></div></section>
    </section>
  </main>
  <div class="toast" id="toast"></div>
</div>
<script>
const days=['一','二','三','四','五'];
const defaultData={weekStart:'',parityMode:'odd',leadMinutes:5,prepDisplay:'hanzi-zhuyin',periods:[{id:'morning',label:'早',start:'07:55',end:'08:35'},{id:'p1',label:'第1節',start:'08:40',end:'09:20'},{id:'p2',label:'第2節',start:'09:30',end:'10:10'},{id:'p3',label:'第3節',start:'10:30',end:'11:10'}],cells:{}};
function cell(course='',group='',odd='',even='',flow='',noticeOn=false,notice=''){return{course,group,odd,even,flow,noticeOn,notice}}
const sample={
  'morning-0':cell(), 'morning-1':cell('社會技巧','', '學習單','學習單','暖身 → 今日目標 → 情境練習 → 分享'), 'morning-2':cell('G1＋G2 學習策略 C','', '學習單','學習單','準備教材 → 複習 → 今日學習 → 練習'), 'morning-3':cell('G1＋G2 學習策略 C','', '學習單','學習單','準備教材 → 複習 → 今日學習 → 練習'), 'morning-4':cell('功能性動作訓練','', '訓練紀錄單','訓練紀錄單','暖身 → 動作示範 → 分組練習 → 紀錄 → 收操'),
  'p1-0':cell('G6 國語','','甲本、圈詞本','乙本、圈詞本','拿出教材 → 檢查作業 → 複習 → 今日學習 → 練習與訂正'), 'p1-1':cell('G1＋G2 學習策略 C','','學習單','學習單','準備教材 → 複習 → 今日學習 → 練習'), 'p1-2':cell('G3＋G4 國語','','課本、學習單','課本、學習單','拿出教材 → 生詞 → 課文 → 學習單'), 'p1-3':cell('G6 國語','','甲本、學習單','乙本、學習單','拿出教材 → 檢查作業 → 複習 → 今日學習 → 練習與訂正'), 'p1-4':cell('G3＋G4 國語','潛二','課本、習作','課本、習作','拿出教材 → 生詞 → 課文 → 習作'),
  'p2-0':cell('G3＋G4 國語','潛二','圈詞本、學習單','圈詞本、學習單','拿出教材 → 生詞 → 課文 → 學習單'), 'p2-1':cell('G6 國語','','甲本、圈詞本','乙本、圈詞本','拿出教材 → 檢查作業 → 複習 → 今日學習 → 練習與訂正'), 'p2-2':cell('G6 國語','','甲本','乙本','拿出教材 → 複習 → 今日學習 → 練習'), 'p2-3':cell('G3＋G4 國語','潛二','圈詞本、習作','圈詞本、習作','拿出教材 → 生詞 → 課文 → 習作'), 'p2-4':cell('G6 國語','','甲本','乙本','拿出教材 → 複習 → 今日學習 → 練習'),
  'p3-0':cell(), 'p3-1':cell('G3＋G4 國語','','課本、學習單','課本、學習單','拿出教材 → 生詞 → 課文 → 學習單'), 'p3-2':cell(), 'p3-3':cell(), 'p3-4':cell()
};
let data=load(); let lastMode='projection'; let previewKey=null;
function load(){try{const x=JSON.parse(localStorage.getItem('potentialBoardData'));if(x&&x.cells)return {...defaultData,...x,periods:x.periods||defaultData.periods,cells:{...sample,...x.cells}}}catch(e){}return {...defaultData,cells:sample}}
function save(){localStorage.setItem('potentialBoardData',JSON.stringify(data));showToast('設定已儲存，投影看板已更新');renderAll()}
function showToast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}
function exportSettings(){const blob=new Blob([JSON.stringify({app:'potential-classroom-board',version:1,exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='潛能教室課表設定.json';a.click();URL.revokeObjectURL(a.href);showToast('設定檔已匯出')}
function importSettings(file){const reader=new FileReader();reader.onload=()=>{try{const packet=JSON.parse(reader.result);const incoming=packet.data||packet;if(!incoming||!incoming.cells||!Array.isArray(incoming.periods))throw new Error('格式不符');data={...defaultData,...incoming,periods:incoming.periods,cells:{...sample,...incoming.cells}};localStorage.setItem('potentialBoardData',JSON.stringify(data));renderAll();showToast('設定檔已匯入')}catch(e){showToast('匯入失敗：請選擇本看板匯出的設定檔')}};reader.readAsText(file)}
function mins(v){const [h,m]=v.split(':').map(Number);return h*60+m}
function nowInfo(){const d=new Date(), wd=d.getDay(); let parity=data.parityMode;if(parity==='auto'&&data.weekStart){const start=new Date(data.weekStart+'T00:00:00');const diff=Math.floor((new Date(d.getFullYear(),d.getMonth(),d.getDate())-new Date(start.getFullYear(),start.getMonth(),start.getDate()))/86400000);parity=(Math.floor(diff/7)%2===0)?'odd':'even'} if(parity==='auto')parity='odd';return{d,day:wd>=1&&wd<=5?wd-1:null,parity}}
function getEntries(info){if(info.day===null)return[];return data.periods.map((p,pi)=>{const c=data.cells[p.id+'-'+info.day]||cell();return{p,pi,c}}).filter(x=>x.c.course)}
function timeState(info){const cur=info.d.getHours()*60+info.d.getMinutes()+info.d.getSeconds()/60;const slots=getEntries(info);let current=null,next=null;for(const x of slots){const s=mins(x.p.start),e=mins(x.p.end);if(cur>=s&&cur<e)current=x;if(s>cur&&!next)next=x}return{cur,current,next,slots}}
function prep(c,parity){return (parity==='odd'?c.odd:c.even).split(/[,、，]/).map(s=>s.trim()).filter(Boolean)}
const zhuyinMap={'甲本':'ㄐㄧㄚˇ ㄅㄣˇ','乙本':'ㄧˇ ㄅㄣˇ','圈詞本':'ㄑㄩㄢ ㄘˊ ㄅㄣˇ','學習單':'ㄒㄩㄝˊ ㄒㄧˊ ㄉㄢ','習作':'ㄒㄧˊ ㄗㄨㄛˋ','課本':'ㄎㄜˋ ㄅㄣˇ','作業':'ㄗㄨㄛˋ ㄧㄝˋ','聯絡簿':'ㄌㄧㄢˊ ㄌㄨㄛˋ ㄅㄨˋ','訓練紀錄單':'ㄒㄩㄣˋ ㄌㄧㄢˋ ㄐㄧˋ ㄌㄨˋ ㄉㄢ','鉛筆盒':'ㄑㄧㄢ ㄅㄧˇ ㄏㄜˊ','教材':'ㄐㄧㄠˋ ㄘㄞˊ','計算本':'ㄐㄧˋ ㄙㄨㄢˋ ㄅㄣˇ'};
function formatPrepItem(item){const mode=data.prepDisplay||'hanzi';const z=zhuyinMap[item];if(mode==='hanzi'||!z)return escape(item);if(mode==='zhuyin')return `<span class="prep-zhuyin-only">${escape(z)}</span>`;return `<span class="prep-bilingual"><strong>${escape(item)}</strong><small>${escape(z)}</small></span>`}
function escape(s){return String(s||'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function flow(c){return String(c.flow||'').split(/\s*(?:→|->|\n)\s*/).map(s=>s.trim()).filter(Boolean)}
function timeDiff(target,cur){let sec=Math.max(0,Math.round((target-cur)*60));const h=Math.floor(sec/3600);sec%=3600;const m=Math.floor(sec/60),s=sec%60;return h?`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function card(x,info,kind){if(!x)return `<div class="panel-head"><h3>${kind==='main'?'今日課程':'下一節課程'}</h3></div><div class="current-card"><div class="empty">目前沒有其他課程，請查看本週課表。</div></div>`;const items=prep(x.c,info.parity);const tags=[x.c.group,x.p.label+' '+x.p.start+'–'+x.p.end].filter(Boolean);const notice=x.c.noticeOn&&x.c.notice?`<div class="notice-banner"><span class="icon">⚠</span><span><strong>重要預告</strong><br>${escape(x.c.notice)}</span></div>`:'';const preview=kind==='preview';return `<div class="panel-head"><h3>${preview?'課表預覽':kind==='main'?(timeState(info).current?'現在上課':'下一節準備'):'再下一節'}</h3><span class="pill ${kind==='main'?'orange':''}">${preview?'預覽':kind==='main'?'請準備':'提前查看'}</span></div><div class="current-card">${notice}<div class="current-title">${escape(x.c.course)}</div><div class="current-meta">${tags.map(t=>`<span class="tag">${escape(t)}</span>`).join('')}</div><p class="check-title">${preview?'準備項目':kind==='main'&&timeState(info).current?'本節準備':'請先準備'}</p><div class="prep-list">${items.length?items.map(i=>`<div class="prep-item"><span class="box"></span>${formatPrepItem(i)}</div>`).join(''):'<div class="empty">尚未填寫準備項目</div>'}</div><div class="flow"><p class="check-title">本節課堂流程</p><div class="flow-list">${flow(x.c).length?flow(x.c).map((f,i)=>`<div class="flow-step ${i===0&&!preview&&timeState(info).current?'active':''}"><span class="num">${i+1}</span>${escape(f)}</div>`).join(''):'<div class="empty">尚未填寫課堂流程</div>'}</div></div></div>${kind==='main'&&timeState(info).next?`<div class="countdown"><div class="countdown-label">距離下一節開始</div><div class="countdown-value" data-countdown="${mins(timeState(info).next.p.start)}">--:--</div></div>`:''}`}
function renderProjection(){const info=nowInfo(),state=timeState(info);document.getElementById('projectionView').classList.toggle('preview-mode',Boolean(previewKey));document.getElementById('dateLine').textContent=`115 學年度　${info.day===null?'非上課日':'星期'+days[info.day]}`;document.getElementById('todayTitle').textContent=previewKey?'課表預覽':state.current?state.current.c.course:'今天的課前準備';document.getElementById('weekInfo').textContent=previewKey?'已選取課表內容｜按「回到即時模式」返回自動切換':`${info.parity==='odd'?'奇數週':'偶數週'}｜目前時間會自動切換課程`;
let main=state.current;if(!main)main=state.next;let after=state.current?state.next:null;if(previewKey){const [pid,di]=previewKey.split('-');const c=data.cells[previewKey]||cell();main={p:data.periods.find(p=>p.id===pid)||data.periods[0],c};after=null;document.getElementById('mainPanel').innerHTML=card(main,info,'preview');document.getElementById('nextPanel').innerHTML=`<div class="panel-head"><h3>預覽模式</h3><span class="pill">不受目前時間影響</span></div><div class="next-card"><div class="empty">你正在查看指定課表內容。完成檢查後，可返回即時模式讓畫面依時間自動切換。</div><button class="secondary" id="liveBtn" style="margin-top:14px">↩ 回到即時模式</button></div>`}else{document.getElementById('mainPanel').innerHTML=card(main,info,'main');document.getElementById('nextPanel').innerHTML=after?card(after,info,'next'):`<div class="panel-head"><h3>課堂流程提示</h3><span class="pill">教師操作</span></div><div class="next-card"><div class="empty">上課期間可在教師編輯端查看或修改本節流程。課堂進度不會被時間自動推進。</div></div>`;}
const liveBtn=document.getElementById('liveBtn');if(liveBtn)liveBtn.onclick=()=>{previewKey=null;renderProjection()};
document.getElementById('weekPill').textContent=info.parity==='odd'?'奇數週教材':'偶數週教材';renderMini(info);}
function renderMini(info){const grid=document.getElementById('miniGrid');grid.innerHTML=days.map((d,di)=>`<div class="day-col"><div class="day-name">${d}</div>${data.periods.map(p=>{const key=p.id+'-'+di;const c=data.cells[key]||cell();return `<button type="button" class="day-cell ${info.day===di?'active':''} ${c.course?'clickable':''}" data-preview="${key}" aria-label="預覽星期${d}${p.label}${c.course?' '+c.course:''}"><b>${p.label}</b>${c.course?escape(c.course):'—'}</button>`}).join('')}</div>`).join('');grid.querySelectorAll('[data-preview]').forEach(btn=>btn.addEventListener('click',()=>{const c=data.cells[btn.dataset.preview]||cell();if(c.course){previewKey=btn.dataset.preview;renderProjection()}}))}
function renderEditor(){document.getElementById('weekStart').value=data.weekStart||'';document.getElementById('parityMode').value=data.parityMode||'odd';document.getElementById('prepDisplay').value=data.prepDisplay||'hanzi-zhuyin';document.getElementById('leadMinutes').value=data.leadMinutes??5;const body=document.getElementById('editorBody');body.innerHTML=data.periods.map((p,pi)=>`<tr><td><strong>${p.label}</strong><div class="cell"><input data-period="${p.id}" data-field="start" value="${p.start}" aria-label="${p.label}開始時間"><input data-period="${p.id}" data-field="end" value="${p.end}" aria-label="${p.label}結束時間"></div></td>${days.map((_,di)=>{const c=data.cells[p.id+'-'+di]||cell();return `<td><div class="cell"><input data-key="${p.id}-${di}" data-field="course" value="${escape(c.course)}" placeholder="課程／組別"><input data-key="${p.id}-${di}" data-field="group" value="${escape(c.group)}" placeholder="備註／個別提醒"><div class="notice-toggle"><input type="checkbox" data-key="${p.id}-${di}" data-field="noticeOn" ${c.noticeOn?'checked':''}><small>重要預告</small></div><input data-key="${p.id}-${di}" data-field="notice" value="${escape(c.notice)}" placeholder="勾選後才會顯示"><small>奇數週準備</small><input data-key="${p.id}-${di}" data-field="odd" value="${escape(c.odd)}" placeholder="例如：甲本、學習單"><small>偶數週準備</small><input data-key="${p.id}-${di}" data-field="even" value="${escape(c.even)}" placeholder="例如：乙本、學習單"><small>課堂流程（用 → 分隔）</small><textarea data-key="${p.id}-${di}" data-field="flow" placeholder="準備教材 → 複習 → 練習">${escape(c.flow)}</textarea></div></td>`}).join('')}</tr>`).join('')}
function readEditor(){data.weekStart=document.getElementById('weekStart').value;data.parityMode=document.getElementById('parityMode').value;data.prepDisplay=document.getElementById('prepDisplay').value;data.leadMinutes=Number(document.getElementById('leadMinutes').value)||0;document.querySelectorAll('[data-period][data-field]').forEach(el=>{const p=data.periods.find(x=>x.id===el.dataset.period);if(p)p[el.dataset.field]=el.value});document.querySelectorAll('[data-key][data-field]').forEach(el=>{const c=data.cells[el.dataset.key]||cell();c[el.dataset.field]=el.type==='checkbox'?el.checked:el.value;data.cells[el.dataset.key]=c})}
function renderAll(){renderProjection();renderEditor()}
document.querySelectorAll('.mode-btn').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.mode-btn').forEach(x=>x.classList.remove('active'));btn.classList.add('active');lastMode=btn.dataset.mode;document.getElementById('projectionView').classList.toggle('hide',lastMode!=='projection');document.getElementById('editorView').classList.toggle('show',lastMode==='editor')}));
document.getElementById('exportBtn').addEventListener('click',exportSettings);document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('importFile').click());document.getElementById('importFile').addEventListener('change',e=>{if(e.target.files[0])importSettings(e.target.files[0]);e.target.value=''});
document.getElementById('saveBtn').addEventListener('click',()=>{readEditor();save()});document.getElementById('resetBtn').addEventListener('click',()=>{if(confirm('確定要恢復目前的範例資料嗎？')){data={...defaultData,cells:sample};renderAll();showToast('已恢復範例資料，請按儲存設定') }});document.getElementById('fullscreenBtn').addEventListener('click',()=>document.documentElement.requestFullscreen?.());
function tick(){const d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('zh-TW',{hour12:false});document.getElementById('clockDate').textContent=d.toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric'});renderProjection();}renderAll();setInterval(tick,1000);
</script>
</body>

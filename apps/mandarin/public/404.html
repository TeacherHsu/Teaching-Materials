<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>找不到頁面 — 國語課文樂園</title>
    <!--
      GitHub Pages 對深連結（例如直接開
      /Teaching-Materials/mandarin/#/course/115AG3H/lesson/01）沒有問題，
      因為 # 之後的部分不會送到伺服器。這支 404.html 只在使用者輸入了
      不存在的「真實路徑」（例如少打 index.html、或打錯資料夾名）時才會出現。
      這裡不做自動導轉猜測，只給一個清楚的入口連結，避免猜錯路徑造成更混亂的體驗。
    -->
    <style>
      body {
        font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        background: #faf7f2;
        color: #33302c;
        margin: 0;
      }
      .box {
        text-align: center;
        padding: 2rem;
      }
      h1 {
        font-size: 28px;
      }
      a {
        display: inline-block;
        margin-top: 1rem;
        font-size: 20px;
        padding: 0.75rem 1.5rem;
        background: #3d6b63;
        color: #fff;
        text-decoration: none;
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>找不到這個頁面</h1>
      <p>網址可能打錯了，或這一課還沒上線。</p>
      <a href="./index.html">回到國語課文樂園首頁</a>
    </div>
  </body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <link rel="icon" type="image/x-icon" sizes="64x64" href="data:,">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>六上形似字跑酷</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Bungee&display=swap" rel="stylesheet">
  <!-- Three.js r128 與後製泛光（Bloom）模組 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/GammaCorrectionShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none; }
    body { font-family: 'Noto Sans TC', system-ui, sans-serif; background: #241a33; color: #fff7ec; user-select: none; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .en { font-family: 'Bungee', 'Noto Sans TC', sans-serif; letter-spacing: 1px; }

    /* ===== 遊戲中 HUD（簡潔，左上大字） ===== */
    .hud { position: fixed; z-index: 5; pointer-events: none; text-shadow: 0 2px 8px rgba(0,0,0,.45); }
    .hud.tl { top: 12px; left: 12px; }
    .hud.panel { background: rgba(20,14,30,.78); border: 1px solid rgba(255,255,255,.14); border-radius: 14px; padding: 8px 14px; text-shadow: none; }
    .pause-btn { pointer-events: auto; min-height: 48px; padding: 4px 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,.4); background: rgba(20,14,30,.78); color: #fff4e3; font-size: 18px; font-weight: 700; font-family: inherit; cursor: pointer; }
    .tut { position: fixed; left: 16px; right: 16px; bottom: 160px; z-index: 8; max-width: 600px; margin: 0 auto; background: rgba(20,14,30,.9); border: 2px solid #7dd3fc; border-radius: 18px; padding: 14px 16px; font-size: 22px; line-height: 1.6; font-weight: 700; color: #fff4e3; }
    .tut.hidden { display: none; }
    .tut.low { bottom: 16px; }
    .tut .step { color: #7dd3fc; font-size: 18px; }
    .tut .row-btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
    .tut .btn { width: auto; flex: 1 1 120px; margin-top: 0; }
    .nice { position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%); z-index: 6; pointer-events: none; font-size: 20px; font-weight: 700; color: #bbf7d0; background: rgba(20,14,30,.8); border-radius: 12px; padding: 4px 14px; opacity: 0; transition: opacity .15s; white-space: nowrap; }
    .nice.show { opacity: 1; }
    /* 複習模式 */
    .rv-q { font-size: 22px; margin: 6px 0 12px; }
    .rv-opts { display: grid; gap: 12px; margin: 10px 0; }
    .rv-opt { min-height: 72px; font-size: 34px; font-weight: 900; font-family: inherit; border-radius: 16px; border: 3px solid #c27a0e; background: #fff4d0; color: #1f0e00; cursor: pointer; letter-spacing: 4px; }
    .rv-opt[disabled] { opacity: .45; text-decoration: line-through; cursor: default; }
    .rv-opt.right { background: #bbf7d0; border-color: #15803d; opacity: 1; text-decoration: none; }
    .rv-hint { font-size: 22px; color: #fde68a; min-height: 36px; }
    .rv-hint mark { background: #fde68a; color: #1f0e00; border-radius: 6px; padding: 0 4px; }
    .menu-extra { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 16px; }
    .menu-extra .btn { width: auto; flex: 1 1 200px; margin-top: 0; }
    .hud .lbl { font-size: 18px; font-weight: 700; color: #f3dfcf; opacity: .85; }
    .hud .bignum { font-size: clamp(40px, 7vw, 64px); font-weight: 900; line-height: 1; color: #fff7ec; }
    .hud .bignum small { font-size: .45em; color: #f3dfcf; }
    .hud .sub { font-size: 18px; font-weight: 900; color: #f3dfcf; margin-top: 4px; }
    .hud .missbar { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 18px; font-weight: 900; color: #ff8fa3; }
    .hud.tr { top: 14px; right: 16px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
    .mode-tag { border: 2px solid #f6ad37; color: #f6ad37; border-radius: 999px; padding: 3px 12px; font-weight: 900; font-size: 18px; background: rgba(36,26,51,.45); }
    .coins-row { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; max-width: min(430px, 60vw); }
    .slot { min-width: 34px; height: 34px; padding: 0 6px; border-radius: 17px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 13px; background: rgba(20,14,30,.45); border: 2px dashed rgba(255,214,170,.45); color: rgba(255,224,190,.6); text-shadow: none; }
    .slot.poop { background: #6b3f1d; border: 2px solid #a0662f; color: #ffe; font-size: 18px; animation: pop .45s; }
    .lessons { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; align-items: center; font-weight: 700; color: #f3dfcf; }
    .lessons label { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-size: 20px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.2); border-radius: 999px; padding: 4px 14px; cursor: pointer; }
    .lessons input { width: 22px; height: 22px; }
    .settings { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin: 0 0 16px; font-size: 20px; font-weight: 700; color: #f3dfcf; }
    .settings select, .settings label { min-height: 44px; font-size: 20px; font-family: inherit; border-radius: 12px; }
    .settings select { padding: 4px 10px; background: #fff4e3; color: #2b1606; border: none; font-weight: 700; }
    .settings label { display: inline-flex; align-items: center; gap: 8px; }
    .settings input { width: 22px; height: 22px; accent-color: #f6ad37; }
    .tts-reset { min-height: 44px; padding: 4px 14px; border-radius: 12px; border: 1px dashed rgba(255,255,255,.4); background: transparent; color: #f3dfcf; font-size: 18px; font-family: inherit; cursor: pointer; }
    .tts { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; min-width: 48px; padding: 6px 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.1); color: #fff4e3; font-size: 20px; font-weight: 700; font-family: inherit; cursor: pointer; }
    .tts[disabled] { opacity: .55; cursor: not-allowed; font-size: 18px; }

    .lessons input { accent-color: #f6ad37; }
    .slot.got { background: radial-gradient(circle at 35% 30%, #fff7cc, #facc15 55%, #b45309); border: 2px solid #fde68a; color: #4a2504; box-shadow: 0 0 12px rgba(250,204,21,.8); animation: pop .45s cubic-bezier(.175,.885,.32,1.275); }
    @keyframes pop { 0% { transform: scale(.3); } 100% { transform: scale(1); } }
    .hint { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 5; pointer-events: none; background: rgba(36,26,51,.62); border: 1px solid rgba(255,255,255,.15); border-radius: 999px; padding: 7px 18px; font-size: 22px; font-weight: 700; color: #f3dfcf; max-width: calc(100vw - 32px); text-align: center; backdrop-filter: blur(6px); }

    /* ===== 當排語詞列：固定螢幕字級，三欄對應左／中／右跑道 ===== */
    .strip { position: fixed; left: 16px; right: 16px; top: 150px; z-index: 7; max-width: 640px; margin: 0 auto; }
    .strip.hidden { display: none; }
    .strip-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .strip .col { position: relative; min-height: 76px; display: flex; align-items: center; justify-content: center; padding: 8px; border-radius: 16px; background: #fff4d0; color: #1f0e00; font-weight: 900; white-space: nowrap; border: 3px solid #c27a0e; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
    .strip .col.empty { background: rgba(36,26,51,.45); border: 2px dashed rgba(255,255,255,.3); box-shadow: none; }
    .strip .col.here { outline: 4px solid #7dd3fc; outline-offset: 3px; }
    .strip .col.here::after { content: '小黑在這'; position: absolute; bottom: -34px; left: 50%; transform: translateX(-50%); font-size: 18px; font-weight: 700; color: #7dd3fc; text-shadow: 0 2px 6px rgba(0,0,0,.6); white-space: nowrap; }
    .strip-foot { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px 12px; margin-top: 44px; }
    .strip-msg { font-size: 22px; font-weight: 700; color: #fff4e3; background: rgba(36,26,51,.75); border-radius: 12px; padding: 6px 12px; white-space: nowrap; }
    .strip .bar { order: -1; flex: 1 1 100%; height: 12px; border-radius: 6px; background: rgba(255,255,255,.2); overflow: hidden; }
    .strip .bar i { display: block; height: 100%; width: 100%; background: #f6ad37; }
    .go-btn { white-space: nowrap; min-height: 48px; padding: 6px 18px; border: none; border-radius: 14px; background: #f6ad37; color: #2b1606; font-size: 22px; font-weight: 900; font-family: inherit; cursor: pointer; }

    .toast { position: fixed; left: 16px; right: 16px; top: 18%; margin: 0 auto; width: fit-content; max-width: calc(100vw - 32px); z-index: 6; font-weight: 900; font-size: 22px; line-height: 1.5; padding: 8px 18px; border-radius: 16px; pointer-events: none; opacity: 0; text-align: center; overflow-wrap: anywhere; }
    .toast.ok { color: #3b1d06; background: linear-gradient(90deg, #fde047, #f6ad37); box-shadow: 0 0 30px rgba(246,173,55,.8); }
    .toast.bad { color: #fff; background: rgba(190,18,60,.92); border: 2px solid #fda4af; box-shadow: 0 0 30px rgba(244,63,94,.6); }
    .toast.show { animation: toast 1.2s ease-out forwards; }
    @keyframes toast { 0% { opacity: 0; } 12% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
    .flash { position: fixed; inset: 0; background: radial-gradient(circle, rgba(244,63,94,0) 40%, rgba(244,63,94,.5)); z-index: 4; pointer-events: none; opacity: 0; transition: opacity .25s; }

    .ctrl { position: fixed; bottom: 70px; z-index: 5; width: 78px; height: 78px; border-radius: 50%; border: 2px solid rgba(255,255,255,.5); background: rgba(36,26,51,.55); backdrop-filter: blur(6px); color: #f6ad37; font-size: 34px; font-weight: 900; display: none; align-items: center; justify-content: center; }
    .ctrl.l { left: 16px; } .ctrl.r { right: 16px; }
    @media (pointer: coarse) { .ctrl { display: flex; } }

    /* ===== 標題選單（左側大字排版） ===== */
    .menu { position: fixed; inset: 0; z-index: 20; overflow-y: auto; background: linear-gradient(90deg, rgba(28,18,40,.88) 0%, rgba(28,18,40,.62) 48%, rgba(28,18,40,0) 75%); padding: clamp(24px, 6vh, 64px) clamp(18px, 5vw, 72px); }
    .menu.hidden { display: none; }
    .menu .tag { color: #f6ad37; font-size: 16px; }
    .title-row { display: flex; align-items: flex-start; gap: 14px; margin: 6px 0 10px; flex-wrap: wrap; }
    .title-row h1 { margin: 0; font-size: clamp(56px, 12vw, 130px); font-weight: 900; line-height: .95; color: #fff4e3; text-shadow: 0 6px 30px rgba(0,0,0,.35); }
    .badge { background: #f6ad37; color: #2b1606; font-weight: 900; font-size: clamp(24px, 4.5vw, 46px); padding: 4px 18px; border-radius: 10px; transform: rotate(-4deg); margin-top: 18px; box-shadow: 0 6px 0 #b36b14; }
    .menu .desc { max-width: 680px; font-size: 22px; line-height: 1.6; color: #ead9cc; font-weight: 700; margin: 0 0 18px; }
    .menu .desc b { color: #f6ad37; }
    .modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; max-width: 760px; }
    @media (max-width: 720px) { .modes { grid-template-columns: 1fr; } .menu { background: linear-gradient(180deg, rgba(28,18,40,.9) 0%, rgba(28,18,40,.78) 70%, rgba(28,18,40,.5) 100%); } }
    .mode { text-align: left; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14); border-radius: 16px; padding: 14px 16px; color: #fff; font-family: inherit; cursor: pointer; transition: background .2s, transform .15s, border-color .2s; }
    .mode:hover { background: rgba(255,255,255,.12); transform: translateY(-3px); border-color: #f6ad37; }
    .mode h3 { margin: 0 0 6px; font-size: 26px; font-weight: 900; }
    .mode p { margin: 0; font-size: 22px; line-height: 1.6; color: #e6d6ca; font-weight: 500; }
    .mode.e h3 { color: #f6ad37; } .mode.m h3 { color: #7dd3fc; } .mode.h h3 { color: #fb7185; }
    .keys { margin: 18px 0 0; font-size: 20px; display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; align-items: center; max-width: 520px; color: #ead9cc; font-weight: 700; }
    .keys .k { display: flex; gap: 6px; align-items: center; }
    kbd { font-family: 'Bungee', sans-serif; font-size: 18px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.35); border-bottom-width: 3px; border-radius: 7px; padding: 3px 9px; color: #fff; }

    /* ===== 倒數、結算 ===== */
    .center { position: fixed; inset: 0; z-index: 21; display: flex; align-items: safe center; justify-content: center; padding: 16px; overflow-y: auto; touch-action: pan-y; }
    .center.hidden { display: none; }
    .count { font-size: 140px; font-weight: 900; color: #fff4e3; text-shadow: 0 0 30px #f6ad37, 0 8px 0 rgba(0,0,0,.25); animation: pop .5s; }
    .card { background: rgba(36,26,51,.82); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,.16); border-radius: 26px; padding: 22px 20px calc(16px + env(safe-area-inset-bottom)); max-width: 520px; width: 100%; max-height: calc(100dvh - 32px); overflow-y: auto; min-height: 0; text-align: center; box-shadow: 0 30px 60px rgba(0,0,0,.45); }
    .card h2 { margin: 6px 0; font-size: 32px; font-weight: 900; color: #fff4e3; }
    .card p { margin: 8px 0; color: #ead9cc; font-weight: 700; font-size: 22px; line-height: 1.6; }
    .fix-big { font-size: 28px; font-weight: 900; color: #fff4e3; }
    .fix-big b { display: inline-block; background: #fff4d0; color: #1f0e00; border-radius: 10px; padding: 0 10px; margin: 0 4px; }
    .fix-list { list-style: none; padding: 0; margin: 8px 0; text-align: left; }
    .fix-list li { font-size: 22px; line-height: 1.6; padding: 6px 10px; margin-bottom: 12px; border-radius: 12px; background: rgba(255,255,255,.07); }
    .fix-list li s { color: #fda4af; } .fix-list li b { color: #fde68a; }
    .card .row-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
    .stars { font-size: 40px; letter-spacing: 4px; }
    .score-box { display: flex; justify-content: center; gap: 28px; margin: 12px 0; font-weight: 900; color: #d8c6ba; font-size: 20px; }
    .score-box b { display: block; font-size: 34px; color: #f6ad37; }
    .btn { display: block; width: 100%; margin-top: 10px; border: none; border-radius: 14px; padding: 13px; min-height: 52px; font-size: 22px; font-weight: 900; color: #2b1606; background: #f6ad37; box-shadow: 0 6px 0 #b36b14; font-family: inherit; cursor: pointer; }
    .btn.gray { background: rgba(255,255,255,.1); color: #f3dfcf; box-shadow: none; border: 1px solid rgba(255,255,255,.25); }
    .btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #b36b14; }
    .chips { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 10px 0; justify-items: center; }
    .card .chips { display: flex; flex-wrap: wrap; justify-content: center; } .card .chips .slot { font-size: 22px; height: auto; min-height: 44px; padding: 8px 14px; border-radius: 22px; }
    /* 減少動態：系統偏好或選單勾選（body.rm）都適用 */
    body.rm .slot.got, body.rm .slot.poop, body.rm .count, body.rm .toast.show { animation: none !important; }
    body.rm .toast.show { opacity: 1; }
    body.rm .mode:hover { transform: none; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- 遊戲中 HUD -->
  <div class="hud tl panel">
    <div class="lbl">正確語詞</div>
    <div class="bignum"><span id="got-n">0</span><small> / <span id="goal-n">10</span></small></div>
    <div class="missbar">✖ 吃錯 <span id="miss">0</span> / 6</div>
  </div>
  <div class="hud tr">
    <span class="mode-tag" id="mode-tag">初級</span>
    <button class="pause-btn" id="pause-btn" type="button" onclick="pauseGame()">⏸ 暫停</button>
  </div>
  <div hidden><span id="slots"></span><span id="time"></span><span id="lv-name"></span></div>
  <div class="tut hidden" id="tut" aria-live="polite"></div>
  <div class="nice" id="nice"></div>
  <div class="hint">選用字正確的語詞</div>
  <div class="strip hidden" id="strip" aria-live="polite">
    <div class="strip-cols" id="strip-cols"></div>
    <div class="strip-foot"><span class="strip-msg" id="strip-msg">看清楚，再選跑道</span><div class="bar" id="strip-bar"><i id="strip-fill"></i></div><button class="go-btn" id="go-btn" type="button" onclick="endRead()">看好了 ▶</button></div>
  </div>

  <div class="toast" id="toast"></div>
  <button class="ctrl l" id="btn-l" type="button" aria-label="往左">◀</button>
  <button class="ctrl r" id="btn-r" type="button" aria-label="往右">▶</button>

  <!-- 標題選單 -->
  <div class="menu" id="menu">
    <div class="tag en">WORD RUN • 形似字跑酷</div>
    <div class="title-row"><h1>小黑</h1><span class="badge">六上形似字跑酷</span></div>
    <p class="desc">每一排語詞會先停下來讓你看清楚，再左右換道，<b>只吃用字完全正確的語詞金幣</b>，錯別字要閃開！<br><span id="fun-desc">吃到錯別字，會先停下來看正確的字。</span>收集 <b><span id="goal-desc">10</span> 個不同的正確語詞</b>就過關！（翰林六上第 1～6 課）</p>
    <div class="lessons" id="lessons">課次：</div>
    <div class="settings">
      <label>看字時間 <select id="read-sec"><option value="3">3 秒</option><option value="4" selected>4 秒</option><option value="5">5 秒</option><option value="0">看好了再按</option></select></label>
      <label><input type="checkbox" id="rm-box"> 減少畫面動態</label>
      <label><input type="checkbox" id="fun-box"> 趣味模式（吃錯變 💩）</label>
      <label>朗讀速度 <select id="tts-rate"><option value="0.75">慢</option><option value="0.85" selected>標準</option><option value="1">快</option></select></label>
      <button class="tts-reset" type="button" onclick="resetSettings()">還原預設</button>
      <button class="tts" type="button" id="tts-rules" onclick="speak(RULES_TEXT)">🔊 聽規則</button>
    </div>
    <div class="menu-extra">
      <button class="btn gray" type="button" onclick="startTutorial()">📖 玩法說明（先練習）</button>
      <button class="btn gray" type="button" onclick="startReview()">📝 複習模式（不計時）</button>
    </div>
    <div class="modes">
      <button class="mode e" type="button" onclick="start('easy')"><h3>初級</h3><p>一次一枚：看清楚對不對，再決定吃不吃。</p></button>
      <button class="mode m" type="button" onclick="start('medium')"><h3>中級</h3><p>一次兩枚：同一個語詞的正字和錯字，選出正確那一枚。</p></button>
      <button class="mode h" type="button" onclick="start('hard')"><h3>高級</h3><p>一次三枚：同一個語詞的正字和兩個錯字，只有一枚正確。</p></button>
    </div>
    <div class="keys">
      <div class="k"><kbd>←</kbd><kbd>→</kbd> / <kbd>A</kbd><kbd>D</kbd></div><div>換跑道</div>
      <div class="k"><kbd>📱</kbd></div><div>手機：左右滑動，或點左右按鈕</div>
    </div>
  </div>

  <div class="center hidden" id="center"></div>

  <script>
    // =====================================================================
    //  遊戲規則
    // =====================================================================
    // 語詞：翰林六上第1～6課生詞（各年級版只換 DATA 與標題，程式相同）；錯字取自該課官方形似字組，並排除換字後仍是《國語辭典簡編本》詞條者

        if (dustPos[i * 3 + 2] > 12) { dustPos[i * 3 + 2] -= 160; dustPos[i * 3] = (Math.random() - .5) * 30; }
      }

      dog.position.x += (LANES[lane] - dog.position.x) * Math.min(1, dt * 11);
      lean += (0 - lean) * Math.min(1, dt * 5);
      dog.rotation.z = -lean * 0.18;
      dog.rotation.y = -lean * 0.25;
      const moving = (running && phase === 'run') || (menuOn && !RM);
      const k = T * (running ? 15 : 8);
      const a = Math.sin(k) * (moving ? 0.9 : 0);
      legs[0].rotation.x = a; legs[3].rotation.x = a;
      legs[1].rotation.x = -a; legs[2].rotation.x = -a;
      dog.position.y = Math.abs(Math.sin(k)) * (moving ? 0.14 : 0);
      headG.rotation.x = Math.sin(k) * 0.08;
      tailG.rotation.z = Math.sin(T * 14) * 0.5;
      earL.rotation.x = earR.rotation.x = Math.sin(k + 1) * 0.3;

      // 金幣
      if (running) {
        sinceRow += sp * dt;
        if (!tutorial && sinceRow >= mode.gap) { sinceRow -= mode.gap; spawnRow(SPAWN_Z); }
        // 判讀期倒數；0＝「看好了再按」
        if (phase === 'read' && readTotal > 0) {

          if (readLeft <= 0) endRead();
        }

      for (const r of rows) {

      }
      for (const c of coins) {
        if (c.done) continue;
        c.grp.position.z = c.row.z;   // 金幣不搖擺、不浮動，字面穩定
        const z = c.grp.position.z;
        if (running && phase === 'run' && z > -0.9 && z < 0.7 && Math.abs(c.grp.position.x - dog.position.x) < 0.9) collect(c);   // 判定寬度：換道途中不易誤吃隔壁道
      }
      for (const r of rows) if (!r.done && r.z >= 0.7) {   // 過線就退場，不再衝向鏡頭
        resolveRow(r);
        if (tutorial) { tutStep(3, 'miss'); continue; }
        if (r.danger && !r.coins.some(c => c.lane === lane && !c.ok)) nice('閃開錯字，很好！');
      }
      for (let i = rows.length - 1; i >= 0; i--) if (rows[i].done) rows.splice(i, 1);
      for (let i = coins.length - 1; i >= 0; i--) if (coins[i].done) coins.splice(i, 1);

      for (let i = bursts.length - 1; i >= 0; i--) {
        const b = bursts[i]; b.life -= dt;
        const arr = b.pts.geometry.attributes.position.array;
        b.v.forEach((v, j) => { v.y -= 9 * dt; arr[j * 3] += v.x * dt; arr[j * 3 + 1] += v.y * dt; arr[j * 3 + 2] += v.z * dt + sp * dt; });
        b.pts.geometry.attributes.position.needsUpdate = true;
        b.pts.material.opacity = Math.max(0, b.life / b.max);
        if (b.life <= 0) { scene.remove(b.pts); b.pts.geometry.dispose(); b.pts.material.dispose(); bursts.splice(i, 1); }
      }
      for (let i = poops.length - 1; i >= 0; i--) {
        const p = poops[i]; p.life -= dt; p.vy -= 12 * dt;
        if (!RM) { p.g.position.y = Math.max(1.6, p.g.position.y + p.vy * dt); p.g.rotation.y += dt * 4; }
      p.g.position.z += sp * dt * 0.5;
        if (p.life <= 0) { scene.remove(p.g); poops.splice(i, 1); }
      }
      for (let i = rings.length - 1; i >= 0; i--) {
        const r = rings[i]; r.life -= dt;
        r.m.scale.setScalar(1 + (0.6 - r.life) * 7);
        r.m.material.opacity = Math.max(0, r.life / 0.6);
        r.m.position.z += sp * dt;
        if (r.life <= 0) { scene.remove(r.m); rings.splice(i, 1); }
      }

      // 鏡頭：選單時從側面看小黑，遊戲中跟在後方；FOV 衝刺、震動
      camera.fov = camera.userData.baseFov || BASE_FOV;   // 不做 FOV 衝刺與震動，字面大小穩定
      camera.updateProjectionMatrix();
      const want = menuOn ? tmp.set(-0.6, 2.4, 7.4) : tmp.set(dog.position.x * 0.55, 4.6, 9.2);
      camera.position.lerp(want, Math.min(1, dt * (menuOn ? 2 : 4)));
      if (menuOn) camera.lookAt(dog.position.x - 3.4, 1.5, -3);   // 小黑在畫面右側，左側留給標題
      else camera.lookAt(dog.position.x * 0.35, 1.3, -9);
      sunLight.position.x = dog.position.x + 4; sunLight.target.position.set(dog.position.x, 0, 0);

      if (composer) {
        bloom.strength = 0.15;
        composer.render();
      } else renderer.render(scene, camera);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // =====================================================================
    //  流程：選單 → 倒數 → 遊戲 → 結算
    // =====================================================================
    function clearCoins() { coins.forEach(c => scene.remove(c.grp)); coins.length = 0; rows.length = 0; hideStrip(); }
    function setHud(on) { document.querySelectorAll('.hud, .hint, .ctrl').forEach(el => el.style.display = on ? '' : 'none'); }
    function poolGoal(pool) { return Math.min(GOAL_MAX, new Set(pool.map(e => e.w)).size); }
    function updateGoalDesc() {
      const sel = [...document.querySelectorAll('#lessons input:checked')].map(i => +i.value);
      document.getElementById('goal-desc').textContent = poolGoal(DATA.filter(e => sel.includes(e.L))) || GOAL_MAX;
    }
    function center(html) { const c = document.getElementById('center'); c.innerHTML = html; c.classList.remove('hidden'); }
    function hideCenter() { document.getElementById('center').classList.add('hidden'); }

    function menu() {
      running = false; menuOn = true; phase = 'off'; tutorial = 0;
      document.getElementById('tut').classList.add('hidden');
      if ('speechSynthesis' in window) speechSynthesis.cancel();
      clearCoins(); hideCenter(); setHud(false);
      lane = 1;
      document.getElementById('menu').classList.remove('hidden');
    }

    function start(key) {
      if (ac && ac.state === 'suspended') ac.resume();
      const sel = [...document.querySelectorAll('#lessons input:checked')].map(i => +i.value);
      if (!sel.length) { alert('請至少勾選一課'); return; }
      POOL = DATA.filter(e => sel.includes(e.L)); lastWord = '';
      if (key === 'hard') { const hp = POOL.filter(e => e.x.length >= 2); if (hp.length) POOL = hp; }   // 高級只出有兩個以上官方錯字的詞
      GOAL = poolGoal(POOL);
      readTotal = +document.getElementById('read-sec').value;
      phase = 'off';
      if ('speechSynthesis' in window) speechSynthesis.cancel();
      modeKey = key; mode = MODES[key];
      document.getElementById('menu').classList.add('hidden');
      menuOn = false; setHud(true);
      document.getElementById('lv-name').textContent = mode.name;
      document.getElementById('mode-tag').textContent = mode.name;
      got = new Set(); hits = 0; wrong = 0; wrongList = []; seconds = 0; recorded = false; lane = 1;
      document.getElementById('miss').textContent = '0';
      document.getElementById('time').textContent = '00:00';
      clearCoins(); buildSlots();
      let z = -28;
      for (; z >= SPAWN_Z; z -= mode.gap) spawnRow(z);
      sinceRow = (z + mode.gap) - SPAWN_Z;   // 讓下一排與最後一排保持 gap 間距
      let k = 3;
      const tick = () => {
        if (k === 0) {
          center('<div class="count">GO!</div>'); sfx('go');
          setTimeout(() => {
            hideCenter(); running = true; phase = 'run';
            clearInterval(clockT);
            clockT = setInterval(() => { if (running && phase === 'run') { seconds++; document.getElementById('time').textContent = fmt(seconds); } }, 1000);
          }, 450);
          return;
        }
        center(`<div class="count">${k}</div>`); sfx('count'); k--; setTimeout(tick, 650);
      };
      tick();
    }

    function record(score) {
      const title = document.title + '（' + mode.name + '）';
      try {
        const KEY = 'shape_run_records';
        const r = JSON.parse(localStorage.getItem(KEY) || '[]');
        r.unshift({ title, score, total: 100, percent: score, time: new Date().toISOString() });
        if (r.length > 100) r.length = 100;
        localStorage.setItem(KEY, JSON.stringify(r));
      } catch (e) {}
    }

    function gameOver() {
      if (!running) return;
      running = false; phase = 'off'; hideStrip();
      clearInterval(clockT);
      saveLastWrong();
      const fix = fixList();
      center(`
        <div class="card">
          <div class="en" style="color:#ff8fa3">TRY AGAIN</div>
          <h2>吃錯 6 次，這一局結束</h2>
          <button class="btn" onclick="startReview(true)">📝 先複習這幾個字</button>
          <button class="btn gray" onclick="start('${modeKey}')">重新開始（${mode.name}）</button>
          <button class="btn gray" onclick="menu()">回選單</button>
          <p>先看一看正確的字，再挑戰一次！</p>
          ${fix}
        </div>`);
      document.querySelectorAll('#center .tts').forEach(syncTtsBtn);
    }

    // 訂正清單：每列一詞，錯字劃掉、正字標出；可整份朗讀
    function fixList() {
      if (!wrongList.length) return '';
      const items = wrongList.map(([x, r]) => { const [b, g] = diffChar(r, x); return `<li><s>${x}</s> → <b>${r}</b>（${b}→${g}）</li>`; }).join('');
      const say = wrongList.map(([x, r]) => `正確寫法是${r}`).join('。');
      return `<ul class="fix-list">${items}</ul><div class="row-btns">${ttsBtn(say, '🔊 聽訂正')}</div>`;
    }

    function finish() {
      if (!running) return;
      running = false; phase = 'off'; hideStrip();
      clearInterval(clockT);
      sfx('win');
      saveLastWrong();
      burst(new THREE.Vector3(dog.position.x, 3, -4), 0xffd166, 24, 0.6);   // 停止作答後只播一次、0.6 秒內結束
      const score = hits + wrong === 0 ? 100 : Math.round(hits / (hits + wrong) * 100);
      const stars = wrong === 0 ? 3 : wrong <= 2 ? 2 : 1;
      if (!recorded) { recorded = true; record(score); }
      const chips = [...got].map(p => `<span class="slot got">${p}</span>`).join('');
      const fix = wrongList.length ? '<p>要訂正的字：</p>' + fixList() : '';
      const next = modeKey === 'easy' ? 'medium' : modeKey === 'medium' ? 'hard' : null;
      setTimeout(() => { center(`
        <div class="card">
          <div class="en" style="color:#f6ad37">STAGE CLEAR</div>
          <h2>${mode.name}過關！</h2>
          <div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>
          <div class="score-box"><div>吃錯<b>${wrong}</b></div><div>時間<b>${fmt(seconds)}</b></div></div>
          ${wrongList.length ? `<button class="btn" onclick="startReview(true)">📝 先複習吃錯的字</button>` : ''}
          ${next ? `<button class="btn${wrongList.length ? ' gray' : ''}" onclick="start('${next}')">挑戰${MODES[next].name} ➜</button>` : ''}
          <button class="btn gray" onclick="menu()">回選單</button>
          <p>收集到的 ${got.size} 個正確語詞：</p>
          <div class="chips">${chips}</div>${fix}
        </div>`); document.querySelectorAll('#center .tts').forEach(syncTtsBtn); }, 700);
    }

    // =====================================================================
    //  P1-5 玩法說明：一步一個任務，學生做到了才進下一步
    // =====================================================================
    const TUT = {
      1: '按鍵盤 ←（或左下的 ◀ 按鈕），讓小黑往左換一條跑道。',
      2: '很好！現在按 →（或 ▶）兩次，讓小黑跑到最右邊。',
      3: '上面三格是三條跑道的語詞。換到用字完全正確的那一格，再按「看好了」。',
      4: '吃錯的話，路會停下來給你看正確的字，看完按「繼續」。吃錯 6 次，這一局就結束。準備好了嗎？',
    };
    function tutPanel(n, extra = '', btns = '') {
      const t = document.getElementById('tut');
      t.innerHTML = `<div class="step">玩法說明 ${n} / 4</div>${extra}${TUT[n]}<div class="row-btns">${ttsBtn(TUT[n], '🔊 聽')}${btns}</div>`;
      t.classList.remove('hidden');
      t.classList.toggle('low', n === 3);
      document.querySelectorAll('.ctrl').forEach(el => el.style.display = n === 3 ? 'none' : '');   // 第 3 步把換道鈕收進說明框，不擋字卡
      t.querySelectorAll('.tts').forEach(syncTtsBtn);
    }
    function startTutorial() {
      if (ac && ac.state === 'suspended') ac.resume();
      const sel = [...document.querySelectorAll('#lessons input:checked')].map(i => +i.value);
      POOL = sel.length ? DATA.filter(e => sel.includes(e.L)) : DATA;
      mode = MODES.medium; modeKey = 'medium'; readTotal = 0; GOAL = 99;
      document.getElementById('menu').classList.add('hidden');
      menuOn = false; setHud(false);
      document.querySelectorAll('.ctrl').forEach(el => el.style.display = '');
      clearCoins(); lane = 1; running = true; tutorial = 1; phase = 'tut';
      document.getElementById('center').classList.add('hidden');
      tutStep(1);
    }
    function tutStep(n, how) {
      tutorial = n;
      if (n === 3) {
        phase = 'tut';
        clearCoins();
        const row = (spawnRow(READ_Z), rows[rows.length - 1]);
        beginRead(row);
        tutPanel(3, how === 'miss' ? '這一排沒吃到，再試一次！<br>' : '', `<button class="btn gray" type="button" onclick="move(-1)">◀ 往左</button><button class="btn gray" type="button" onclick="move(1)">往右 ▶</button>`);
      } else if (n === 4) {
        phase = 'tut'; clearCoins();
        tutPanel(4, how === 'ok' ? '答對了！<br>' : '', `<button class="btn" type="button" onclick="tutStep(3)">再練一次</button><button class="btn gray" type="button" onclick="menu()">我準備好了，回選單</button>`);
      } else tutPanel(n);
    }
    function tutCheck() {
      if (tutorial === 1 && lane === 0) tutStep(2);
      else if (tutorial === 2 && lane === 2) tutStep(3);
    }

    // =====================================================================
    //  P1-8 複習模式：一次一詞、不計時；答錯先給提示，第二次才揭曉
    // =====================================================================
    const LAST_KEY = 'shape_run_last_wrong:' + document.title;
    function saveLastWrong() { try { localStorage.setItem(LAST_KEY, JSON.stringify([...new Set(wrongList.map(w => w[1]))])); } catch (e) {} }
    let rv = null;
    function startReview(fromGame) {
      if ('speechSynthesis' in window) speechSynthesis.cancel();
      let words = [], src = '';
      if (fromGame && wrongList.length) { words = [...new Set(wrongList.map(w => w[1]))]; src = '這一局吃錯的字'; }
      else {
        try { words = JSON.parse(localStorage.getItem(LAST_KEY) || '[]'); } catch (e) {}
        if (words.length) src = '上一局吃錯的字';
        else {
          const sel = [...document.querySelectorAll('#lessons input:checked')].map(i => +i.value);
          words = DATA.filter(e => sel.includes(e.L)).map(e => e.w).sort(() => Math.random() - .5).slice(0, 10);
          src = '勾選課次的語詞';
        }
      }
      words = words.filter(w => DATA.some(e => e.w === w));
      if (!words.length) { alert('請至少勾選一課'); return; }
      running = false; phase = 'off'; clearInterval(clockT); hideStrip();
      document.getElementById('menu').classList.add('hidden'); setHud(false);
      rv = { words, i: 0, src, tries: 0 };
      rvShow();
    }
    function rvShow() {
      const w = rv.words[rv.i], e = DATA.find(d => d.w === w);
      const opts = [w, ...e.x.slice().sort(() => Math.random() - .5).slice(0, 2)].sort(() => Math.random() - .5);
      rv.tries = 0;
      center(`<div class="card" role="dialog" aria-label="複習模式">
        <div class="en" style="color:#7dd3fc">REVIEW</div>
        <p>複習：${rv.src}（${rv.i + 1} / ${rv.words.length}）</p>
        <p class="rv-q">哪一個用字完全正確？</p>
        <div class="rv-opts">${opts.map(o => `<button class="rv-opt" type="button" data-w="${o}" onclick="rvPick(this)">${o}</button>`).join('')}</div>
        <div class="rv-hint" id="rv-hint"></div>
        <div id="rv-next"></div>
        <button class="btn gray" type="button" onclick="menu()">回選單</button>
      </div>`);
    }
    function rvPick(b) {
      const w = rv.words[rv.i];
      const hintEl = document.getElementById('rv-hint');
      if (b.dataset.w !== w) {
        rv.tries++; b.disabled = true; sfx('bad');
        const [bad, good] = diffChar(w, b.dataset.w);
        const pos = [...w].findIndex((ch, k) => ch !== b.dataset.w[k]);
        if (rv.tries < 2) { hintEl.innerHTML = `提示：仔細看第 ${pos + 1} 個字。`; return; }
        hintEl.innerHTML = `「${b.dataset.w}」的 <mark>${bad}</mark> 要改成 <mark>${good}</mark>。`;
      } else { sfx('coin'); hintEl.innerHTML = '正確！'; }
      document.querySelectorAll('.rv-opt').forEach(o => { o.disabled = true; if (o.dataset.w === w) o.classList.add('right'); });
      const say = `正確寫法是${w}`;
      const last = rv.i >= rv.words.length - 1;
      document.getElementById('rv-next').innerHTML = `<div class="row-btns">${ttsBtn(say, '🔊 聽正確寫法')}</div><button class="btn" type="button" onclick="${last ? 'rvDone()' : 'rv.i++; rvShow()'}">${last ? '完成' : '下一個 ▶'}</button>`;
      document.querySelectorAll('#rv-next .tts').forEach(syncTtsBtn);
    }
    function rvDone() {
      center(`<div class="card"><h2>複習完成！</h2><p>一共複習了 ${rv.words.length} 個語詞。</p>
        <button class="btn" type="button" onclick="rv.i = 0; rvShow()">再複習一次</button>
        <button class="btn gray" type="button" onclick="menu()">回選單</button></div>`);
    }

    // =====================================================================
    //  P2-1 記住這台裝置的設定（看字時間、減少動態、趣味模式、朗讀速度）；老師可還原預設
    // =====================================================================
    const SET_KEY = 'shape_run_settings:' + document.title;
    function saveSettings() {
      try { localStorage.setItem(SET_KEY, JSON.stringify({ readSec: document.getElementById('read-sec').value, rm: RM, fun: FUN, rate: document.getElementById('tts-rate').value })); } catch (e) {}
    }
    function applyFun() { document.getElementById('fun-desc').textContent = FUN ? '吃到錯別字，金幣會變成 💩，也會停下來看正確的字。' : '吃到錯別字，會先停下來看正確的字。'; }
    function setRM(v) { RM = v; document.getElementById('rm-box').checked = v; document.body.classList.toggle('rm', v); }
    function loadSettings() {
      let s = null; try { s = JSON.parse(localStorage.getItem(SET_KEY) || 'null'); } catch (e) {}
      if (!s) return;
      if (s.readSec != null) document.getElementById('read-sec').value = s.readSec;
      if (s.rate) document.getElementById('tts-rate').value = s.rate;
      if (typeof s.rm === 'boolean') setRM(s.rm);
      FUN = !!s.fun; document.getElementById('fun-box').checked = FUN; applyFun();
    }
    function resetSettings() {
      try { localStorage.removeItem(SET_KEY); } catch (e) {}
      document.getElementById('read-sec').value = '4'; document.getElementById('tts-rate').value = '0.85';
      setRM(!!(RM_QUERY && RM_QUERY.matches));
      FUN = false; document.getElementById('fun-box').checked = false; applyFun();
    }

    document.getElementById('lessons').insertAdjacentHTML('beforeend', [...new Set(DATA.map(e => e.L))].sort((x, y) => x - y).map(n => `<label><input type="checkbox" value="${n}" checked> 第${n}課</label>`).join(''));
    document.querySelectorAll('#lessons input').forEach(i => i.addEventListener('change', updateGoalDesc));
    const rmBox = document.getElementById('rm-box');
    rmBox.checked = RM; document.body.classList.toggle('rm', RM);
    rmBox.addEventListener('change', () => { setRM(rmBox.checked); saveSettings(); });
    document.getElementById('fun-box').addEventListener('change', e => { FUN = e.target.checked; applyFun(); saveSettings(); });
    document.getElementById('read-sec').addEventListener('change', saveSettings);
    document.getElementById('tts-rate').addEventListener('change', saveSettings);
    loadSettings();
    if (RM_QUERY && RM_QUERY.addEventListener) RM_QUERY.addEventListener('change', e => { RM = e.matches; rmBox.checked = RM; document.body.classList.toggle('rm', RM); });
    updateGoalDesc();
    buildSlots();
    menu();
  </script>
</body>
</html>

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RG3DKit 玩具元件陳列</title>
<link rel="stylesheet" href="../../common.css">
<style>
body { background: var(--surface-0); }
main { max-width: 1240px; margin: auto; padding: 24px; }
h1 { margin: 0; font-size: 1.6rem; } .eyebrow { color: var(--ink-2); font-size: .75rem; letter-spacing: .12em; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0; }
.controls button { min-height: 48px; border: 1px solid #d8c2a5; background: var(--surface-1); color: var(--ink); border-radius: var(--r-sm); padding: 8px 14px; }
.controls button:first-child { background: var(--action); color: white; }
#host { height: 580px; position: relative; isolation: isolate; }
#host canvas { width: 100%; height: 100%; display: block; mask-image: radial-gradient(ellipse 68% 64% at 50% 50%, #000 60%, transparent 100%); }
#host.silhouette canvas { filter: grayscale(1); }
.labels { position: absolute; display: flex; justify-content: space-around; left: 17%; right: 17%; pointer-events: none; color: var(--ink-2); font-size: .8rem; }
.characters { top: 54%; } .materials { bottom: 8%; left: 13%; right: 23%; font-size: .7rem; }
#fallback { padding: 40px; background: var(--surface-1); border-radius: var(--r-lg); }
#fallback ol { display: flex; flex-wrap: wrap; gap: 35px; } #fallback li { border-bottom: 5px solid var(--team); padding: 12px; }
#status { color: var(--ink-2); font-size: .8rem; } [hidden] { display: none !important; }
</style>
</head>
<body><main>
<div class="eyebrow">RG3DKIT / MATERIAL & CHARACTER STUDY</div>
<h1>木桌上的小小探險隊</h1>
<p>四種剪影、六種材質，一顆由遊戲指定點數的骰子。</p>
<div class="controls" aria-label="元件動作">
<button type="button" data-action="hop">hop 全部</button><button type="button" data-action="cheer">cheer 全部</button>
<button type="button" data-roll="1">roll 1</button><button type="button" data-roll="2">roll 2</button><button type="button" data-roll="3">roll 3</button>
<button type="button" data-roll="4">roll 4</button><button type="button" data-roll="5">roll 5</button><button type="button" data-roll="6">roll 6</button>
<button type="button" id="calm" aria-pressed="false">切換 calm</button>
</div>
<div id="host">
<div id="fallback" hidden><p>2D 元件清單：動作已完成，元件狀態會保留。</p><ol>
<li style="--team:var(--team-1)">1 小探險家</li><li style="--team:var(--team-2)">2 迷你機器人</li>
<li style="--team:var(--team-3)">3 小恐龍</li><li style="--team:var(--team-4)">4 書本精靈</li></ol><p id="die-state">骰子：1</p></div>
<div class="labels characters"><span>1 探險家</span><span>2 機器人</span><span>3 小恐龍</span><span>4 書本精靈</span></div>
<div class="labels materials"><span>wood</span><span>woodDark</span><span>plastic 紅</span><span>paper</span><span>felt</span><span>gold</span></div>
</div>
<p id="status" role="status">正在準備元件</p>
</main>
<script src="../../common.js"></script><script src="../../rg3d-kit.js"></script>
<script>
(function () {
  'use strict';
  window.__ready = false;
  const K = window.RG3DKit, host = document.getElementById('host'), status = document.getElementById('status');
  const shot = new URLSearchParams(location.search).get('shot') || 'idle';
  let pieces = [], die, builtScene, value = 1, busy = false, stage;
  if (shot === 'silhouette') host.classList.add('silhouette');
  function build() {
    if (!stage?.scene || builtScene === stage.scene) return;
    builtScene = stage.scene; const T = window.THREE;
    const table = new T.Mesh(K.roundedBox(17, .20, 10, .12), K.MAT.wood); table.position.y = -.11; table.receiveShadow = true; stage.scene.add(table);
    pieces = [0, 1, 2, 3].map((i) => { const p = K.piece(i); p.position.set((i - 1.5) * 1.6, 0, -.55); stage.scene.add(p); return p; });
    if (shot === 'silhouette') pieces.forEach((p) => p.scale.setScalar(.45));
    [K.MAT.wood, K.MAT.woodDark, K.MAT.plastic(K.TOKENS.teams[0]), K.MAT.paper, K.MAT.felt, K.MAT.gold].forEach((mat, i) => {
      const sphere = new T.Mesh(new T.SphereGeometry(.28, 32, 20), mat); sphere.position.set(-3.1 + i * .95, .29, 1.45); sphere.castShadow = true; stage.scene.add(sphere);
      const shadow = K.blobShadow(.75); shadow.position.x = sphere.position.x; shadow.position.z = 1.45; stage.scene.add(shadow);
    });
    die = K.dice(); die.position.set(3.25, 0, 1.3); stage.scene.add(die); die.roll(value, { calm: true }); stage.draw();
  }
  function mode(on, reason) {
    document.getElementById('fallback').hidden = on;
    document.querySelectorAll('.labels').forEach((n) => { n.hidden = !on; });
    status.textContent = on ? '3D 元件已就緒・standard' : '2D 模式・' + reason;
    if (on) Promise.resolve().then(build);
  }
  stage = K.createStage({ host, quality: 'standard', onMode: mode }); window.__stage = stage;
  async function act(name, n, snapshot = false) {
    if (busy) return; busy = true; window.__ready = false;
    const original = stage.tween;
    // 僅截圖入口固定在動作一半，讓 Claude 能重現跳躍與慶祝姿勢。
    if (snapshot) stage.tween = (key, ms, fn) => { fn(.5); stage.draw(); return Promise.resolve(); };
    try {
      if (name === 'roll') { value = n; document.getElementById('die-state').textContent = '骰子：' + n; if (die) await die.roll(n); }
      else if (name === 'hop') await Promise.all(pieces.map((p) => { const from = p.position.clone(); return p.hop(from, from.clone()); }));
      else if (name === 'cheer') await Promise.all(pieces.map((p) => p.cheer()));
    } finally { stage.tween = original; stage.draw(); busy = false; window.__ready = true; }
  }
  document.querySelectorAll('[data-action]').forEach((b) => b.addEventListener('click', () => act(b.dataset.action)));
  document.querySelectorAll('[data-roll]').forEach((b) => b.addEventListener('click', () => act('roll', Number(b.dataset.roll))));
  document.getElementById('calm').addEventListener('click', async (e) => {
    document.body.classList.toggle('calm'); e.currentTarget.setAttribute('aria-pressed', String(document.body.classList.contains('calm')));
    await stage.refresh(); build(); stage.draw(); window.__ready = true;
  });
  stage.ready.then(async () => {
    build();
    if (shot === 'dice6') await act('roll', 6);
    else if (shot === 'hop' || shot === 'cheer') await act(shot, null, true);
    else { if (shot === 'idle' && pieces[0]) await pieces[0].idle({ active: true }); stage.draw(); window.__ready = true; }
  }).catch((e) => { status.textContent = '元件載入失敗：' + e.message; window.__ready = true; });
})();
</script>
</body></html>

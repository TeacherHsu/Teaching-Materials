<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>綜合複習遊戲</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="common.css?v=20261016">
  <style>
    .gcard { display: grid; gap: 6px; }
    .gcard svg, .gcard .thumb { display: block; width: 100%; height: auto; aspect-ratio: 16 / 10; object-fit: cover; border-radius: var(--r-md, 14px); background: #fff8ee; }
    .gcard { box-shadow: var(--shadow-toy); border-color: transparent; transition: transform var(--dur-select, .2s) var(--ease-soft, ease), box-shadow var(--dur-select, .2s); }
    .gcard:hover, .gcard:focus-visible { transform: translateY(-4px); box-shadow: 0 3px 0 #e3cfb3, 0 16px 28px rgba(80,50,20,.2); border-color: var(--action, #a84b17); }
    @media (hover: none) { .gcard:hover { transform: none; } }
    body.calm .gcard:hover, body.calm .gcard:focus-visible { transform: none; }
    .gcard h2 { font-size: 1.4rem; }
    .grades { display: flex; gap: 8px; flex-wrap: wrap; }
    .grades a { min-height: 48px; display: inline-flex; align-items: center; padding: 4px 16px; border-radius: 999px; border: 2px solid var(--line); background: var(--card); color: var(--ink); font-weight: 800; text-decoration: none; }
    .grades a[aria-current] { background: var(--action, #a84b17); color: #fff; border-color: var(--action, #a84b17); }
    .grades a[aria-current]::before { content: '✓ '; }
  </style>
</head>
<body>
  <main class="wrap" id="app"><p>載入中…</p></main>
  <script src="common.js?v=20261017"></script>
  <script>
    const { h, loadBank, gradeKey } = RG;
    // 本機自繪縮圖（不用外部圖庫）：讓學生先看到遊戲長什麼樣子
    const THUMB = {
      monopoly: `<svg viewBox="0 0 160 90" aria-hidden="true"><g stroke="#e8d9c4" stroke-width="2">${[0,1,2,3,4,5].map((i) => `<rect x="${20+i*20}" y="6" width="18" height="16" rx="3" fill="${['#e05a4f','#f0a030','#fff3e0','#3fa45b','#3b82c4','#8b5cc8'][i]}"/><rect x="${20+i*20}" y="68" width="18" height="16" rx="3" fill="${['#d1559a','#fff3e0','#3b82c4','#f0a030','#e05a4f','#3fa45b'][i]}"/>`).join('')}<rect x="20" y="26" width="18" height="38" rx="3" fill="#fff"/><rect x="120" y="26" width="18" height="38" rx="3" fill="#fff"/></g><rect x="66" y="34" width="26" height="26" rx="6" fill="#fff" stroke="#2b1d12" stroke-width="2"/><circle cx="73" cy="41" r="2.5"/><circle cx="85" cy="53" r="2.5"/><circle cx="79" cy="47" r="2.5"/></svg>`,
      snakes: `<svg viewBox="0 0 160 90" aria-hidden="true">${[0,1,2].map((r) => [0,1,2,3,4,5].map((c) => `<rect x="${8+c*24}" y="${6+r*27}" width="22" height="25" rx="4" fill="${(r+c)%2?'#fff':'#fff1c2'}" stroke="#e8d9c4"/>`).join('')).join('')}<line x1="30" y1="72" x2="60" y2="18" stroke="#8a5a2b" stroke-width="4"/><line x1="40" y1="76" x2="70" y2="22" stroke="#8a5a2b" stroke-width="4"/><path d="M128 18 q-20 20 -10 30 t-24 26" stroke="#2f8a4c" stroke-width="7" fill="none" stroke-linecap="round"/><circle cx="128" cy="18" r="6" fill="#2f8a4c"/></svg>`,
      dobble: `<svg viewBox="0 0 160 90" aria-hidden="true"><circle cx="44" cy="45" r="38" fill="#fff" stroke="#a84b17" stroke-width="4"/><circle cx="116" cy="45" r="38" fill="#fff" stroke="#3b82c4" stroke-width="4"/><g font-size="13" font-weight="900" text-anchor="middle" fill="#2b1d12"><text x="44" y="32">等待</text><text x="30" y="56">固定</text><text x="58" y="62">整理</text><text x="116" y="32">機器</text><text x="102" y="56">固定</text><text x="130" y="62">梨花</text></g><rect x="14" y="44" width="32" height="17" rx="4" fill="none" stroke="#1f8a4c" stroke-width="2.5"/><rect x="86" y="44" width="32" height="17" rx="4" fill="none" stroke="#1f8a4c" stroke-width="2.5"/></svg>`,
      bingo: `<svg viewBox="0 0 160 90" aria-hidden="true">${[0,1,2].map((r) => [0,1,2].map((c) => `<rect x="${44+c*25}" y="${6+r*27}" width="23" height="25" rx="4" fill="${r===c?'#a84b17':'#fffaf3'}" stroke="#e8d9c4"/>`).join('')).join('')}<line x1="48" y1="10" x2="112" y2="82" stroke="#1f8a4c" stroke-width="4" stroke-linecap="round"/></svg>`,
      detective: `<svg viewBox="0 0 160 90" aria-hidden="true"><rect width="160" height="90" fill="#f3e2c7"/><path d="M0 60 L160 60 L160 90 L0 90Z" fill="#c99a68"/><rect x="18" y="18" width="30" height="42" fill="#8a5a2b"/><rect x="98" y="16" width="24" height="44" rx="2" fill="#c98b55"/><circle cx="117" cy="40" r="2.5" fill="#f6d16a"/><rect x="58" y="40" width="26" height="26" rx="3" fill="#5b6573"/><circle cx="71" cy="53" r="6" fill="#f6d16a"/><circle cx="138" cy="66" r="11" fill="none" stroke="#2b1d12" stroke-width="4"/><line x1="130" y1="74" x2="122" y2="84" stroke="#2b1d12" stroke-width="5"/></svg>`,
      run: `<svg viewBox="0 0 160 90" aria-hidden="true"><rect width="160" height="90" fill="#241a33"/><path d="M60 90 L76 20 L84 20 L100 90 Z" fill="#3b2d4f"/><path d="M20 90 L72 20 L76 20 L50 90 Z" fill="#33284a"/><path d="M110 90 L84 20 L88 20 L140 90 Z" fill="#33284a"/><rect x="62" y="40" width="36" height="16" rx="5" fill="#fff4d0"/><text x="80" y="52" text-anchor="middle" font-size="11" font-weight="900" fill="#1f0e00">形似字</text><circle cx="80" cy="76" r="8" fill="#f6ad37"/></svg>`,
    };
    const RUN_GRADES = ['G1A', 'G2A', 'G3A', 'G4A', 'G6A'];
    const GAMES = [
      { file: 'monopoly.html', thumb: 'monopoly', title: '課文大富翁', desc: '答對題目就能買下課次的地。', who: '2～4 隊' },
      { file: 'snakes.html', thumb: 'snakes', title: '語文蛇梯棋', desc: '先答題再擲骰，答對就能爬梯子、躲開蛇。', who: '1 人或分隊' },
      { file: 'dobble.html', thumb: 'dobble', title: '語詞哆寶', desc: '找出兩張卡一樣的語詞，再選出它的意思；可雙人對戰。', who: '1 人或雙人' },
      { file: 'bingo.html', thumb: 'bingo', title: '語詞賓果', desc: '聽意思，點語詞，連成一條線就賓果！', who: '1 人或分隊' },
      { file: 'detective.html', thumb: 'detective', title: '課文偵探密室', desc: '找線索、排事件、解機關，用證據破案逃出密室。', who: '1 人或小組' },
      { href: (g) => `../Shape-Run-${g}/`, only: RUN_GRADES, thumb: 'run', title: '形似字跑酷', desc: '只吃用字正確的語詞，閃開錯別字。', who: '1 人' },
    ];
    const GRADE_LINKS = [['G1A', '一上'], ['G2A', '二上'], ['G3A', '三上'], ['G4A', '四上'], ['G6A', '六上']];
    loadBank().then((bank) => {
      const g = gradeKey();
      const app = document.getElementById('app');
      const games = GAMES.filter((x) => !x.only || x.only.includes(g));
      app.replaceChildren(
        h('div', { class: 'topbar' }, [
          h('a', { class: 'back', href: '../../mandarin/' }, '← 課文樂園'),
          h('h1', {}, `${bank.grade}・國語複習遊戲`),
        ]),
        h('nav', { class: 'grades', 'aria-label': '換年級' }, GRADE_LINKS.map(([k, t]) => h('a', { href: `./?g=${k}`, 'aria-current': k === g ? 'page' : null }, t))),
        h('div', { style: 'height:14px' }),
        h('div', { class: 'games' }, games.map((x) => {
          const card = h('a', { class: 'gcard', href: x.href ? x.href(g) : `${x.file}?g=${g}` }, [h('h2', {}, x.title), h('p', {}, x.desc), h('span', { class: 'who' }, x.who)]);
          // 縮圖：升級後的實際遊戲畫面（img/hub/*.webp）；跑酷維持原本深色 SVG（決策 e：跑酷保留原風格）。
          if (x.thumb === 'run') card.insertAdjacentHTML('afterbegin', THUMB[x.thumb]);
          else card.prepend(h('img', { class: 'thumb', src: `img/hub/${x.thumb}.webp?v=1`, alt: '', width: '960', height: '600', loading: 'lazy', decoding: 'async' }));
          return card;
        })),
        h('details', { class: 'note', style: 'margin-top:16px' }, [h('summary', {}, '教師資訊'),
          `${bank.publisher}${bank.grade}第1～${bank.lessons.length}課。題庫：${bank.words.length} 個語詞、${bank.idioms.length} 個成語、${bank.questions.length} 題（語詞意思、注音、形似字、成語、閱讀理解、課文大意），只收已審核的資料。`]),
      );
    }).catch((e) => { document.getElementById('app').textContent = e.message; });
  </script>
</body>
</html>

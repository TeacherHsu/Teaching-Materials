<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>綜合複習遊戲</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <main class="wrap" id="app"><p>載入中…</p></main>
  <script src="common.js"></script>
  <script>
    const { h, loadBank, gradeKey } = RG;
    const GAMES = [
      { file: 'monopoly.html', ico: '🏦', title: '課文大富翁', desc: '答對題目就能買下課次的地。', who: '2～4 隊' },
      { file: 'snakes.html', ico: '🐍', title: '語文蛇梯棋', desc: '先答題再擲骰，答對就能爬梯子、躲開蛇。', who: '1 人或分隊' },
      { file: 'dobble.html', ico: '👀', title: '語詞哆寶', desc: '兩張卡只有一個語詞一樣，找到它，再想想它的意思。', who: '1 人' },
      { file: 'bingo.html', ico: '🎯', title: '語詞賓果', desc: '聽意思，點語詞，連成一條線就賓果！', who: '1 人或分隊' },
      { href: (g) => `../Shape-Run-${g}/`, ico: '🏃', title: '形似字跑酷', desc: '只吃用字正確的語詞，閃開錯別字。', who: '1 人' },
    ];
    loadBank().then((bank) => {
      const app = document.getElementById('app');
      app.replaceChildren(
        h('div', { class: 'topbar' }, [
          h('a', { class: 'back', href: '../../mandarin/' }, '← 課文樂園'),
          h('h1', {}, `${bank.grade}（${bank.publisher}）第1～6課 綜合複習遊戲`),
        ]),
        h('p', { class: 'note' }, `五款遊戲，進遊戲後可選課次、題型與支持程度。`),
        h('div', { class: 'games' }, GAMES.map((g) => h('a', { class: 'gcard', href: g.href ? g.href(gradeKey()) : `${g.file}?g=${gradeKey()}` }, [
          h('div', { class: 'ico', 'aria-hidden': 'true' }, g.ico), h('h2', {}, g.title), h('p', {}, g.desc), h('span', { class: 'who' }, g.who)]))),
      );
    }).catch((e) => { document.getElementById('app').textContent = e.message; });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>語文蛇梯棋</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="common.css?v=4">
  <style>
    .play { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
    @media (max-width: 860px) { .play { grid-template-columns: 1fr; } }
    .sb { position: relative; width: min(100%, calc((100vh - 110px) * 1.2)); margin: 0 auto; aspect-ratio: 6 / 5; }
    .grid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(5, 1fr); gap: 4px; }
    .cell { position: relative; border-radius: 10px; background: var(--card); border: 2px solid var(--line); }
    .cell:nth-child(odd) { background: #fff8ee; }
    .cell.star { background: #fff1c2; }
    .cell.goal { background: #ffe0b8; }
    .cell.here { border: 4px solid var(--ink); }
    .cell .num { position: absolute; top: 3px; left: 5px; z-index: 4; font-weight: 900; font-size: clamp(14px, 1.8vw, 22px); background: rgba(255,255,255,.9); border-radius: 6px; padding: 0 4px; color: var(--ink); }
    .cell .dir { position: absolute; top: 3px; right: 5px; z-index: 4; font-size: 14px; color: var(--muted); }
    .cell .mark { position: absolute; bottom: 3px; right: 5px; z-index: 4; font-size: clamp(12px, 1.4vw, 16px); font-weight: 900; background: rgba(255,255,255,.92); border-radius: 6px; padding: 0 4px; }
    .cell .tokens { position: absolute; left: 4px; bottom: 4px; display: flex; gap: 2px; z-index: 5; }
    svg.links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
    .side { display: grid; gap: 12px; justify-items: center; text-align: center; }
    .side .teams { flex-direction: column; width: 100%; }
    .now-pos { font-size: 1.3rem; font-weight: 900; }
    .legend { font-size: .9rem; color: var(--muted); text-align: left; }
  </style>
</head>
<body>
  <main class="wrap" id="app"><p>載入中…</p></main>
  <script src="common.js?v=2"></script>
  <script src="scene3d.js?v=4"></script>
  <script>
    const { die3d, h, speak, sleep, loadBank, setupPanel, makeDeck, ask, header, token, statsLine, stats, TEAM_COLORS, TEAM_NAMES } = RG;
    const GOAL = 30;
    const LADDERS = { 3: 11, 8: 16, 14: 22, 19: 27 };
    const SNAKES = { 13: 5, 21: 9, 25: 17, 29: 18 };
    const STARS = new Set([6, 10, 17, 24]);
    const cellRC = (n) => { const r = Math.floor((n - 1) / 6); const c = (n - 1) % 6; return [5 - r, r % 2 ? 6 - c : c + 1]; };

    loadBank().then((bank) => {
      const app = document.getElementById('app');
      const nSel = h('select', { 'aria-label': '玩家數' }, [1, 2, 3, 4].map((n) => h('option', { value: n, selected: n === 2 }, n === 1 ? '1 人練習' : `${n} 隊`)));
      const slideSel = h('select', { 'aria-label': '蛇的規則' }, [h('option', { value: 3 }, '最多退 3 格（建議）'), h('option', { value: 99 }, '滑到蛇尾（一般規則）')]);
      const capSel = h('select', { 'aria-label': '長度' }, [h('option', { value: 0 }, '走到終點為止'), h('option', { value: 5 }, '每隊 5 回合'), h('option', { value: 8 }, '每隊 8 回合')]);
      const { el: panel, settings } = setupPanel(bank, { howto: [['❓', '先答一題'], ['🎲', '再擲骰子'], ['🪜', '答對能爬梯子、躲開蛇']], extra: [h('div', { class: 'row' }, [h('strong', {}, '玩家'), nSel, h('strong', {}, '踩到蛇'), slideSel, h('strong', {}, '長度'), capSel])] });
      const msg = h('p', { class: 'note', role: 'alert' });
      app.replaceChildren(header(bank, '語文蛇梯棋'), panel,
        h('p', { class: 'note' }, '每回合先答一題，再擲骰子。答對：踩到梯子往上爬、踩到星星多走 1 格、踩到蛇頭能躲開。沒答對：梯子不能爬、蛇會讓你往回走。'),
        msg, h('div', { class: 'row' }, h('button', { class: 'btn primary', type: 'button', onclick: () => start() }, '開始遊戲')));

      function start() {
        const deck = makeDeck(bank, settings);
        if (!deck.size()) { msg.textContent = '請至少勾選一課和一種題目類型。'; panel.querySelector('input').focus(); return; }
        const maxSlide = Number(slideSel.value);
        const visualSnakes = Object.fromEntries(Object.entries(SNAKES).map(([a, b]) => [a, Math.max(b, Number(a) - maxSlide)]));
        const cap = Number(capSel.value); let roundNo = 1;
        const solo = Number(nSel.value) === 1;
        const players = Array.from({ length: Number(nSel.value) }, (_, i) => ({ name: solo ? '我' : TEAM_NAMES[i], at: 1, right: 0, asked: 0 }));
        let turn = 0, busy = false;
        const cells = {};
        const grid = h('div', { class: 'grid' });
        for (let n = 1; n <= GOAL; n++) {
          const [r, c] = cellRC(n);
          const row = Math.floor((n - 1) / 6);
          const mark = LADDERS[n] ? `🪜→${LADDERS[n]}` : SNAKES[n] ? `🐍→${visualSnakes[n]}` : STARS.has(n) ? '⭐+1' : n === GOAL ? '🏆' : '';
          const dir = (n - 1) % 6 === 0 && n !== 1 ? '↑' : n % 6 === 0 ? '' : row % 2 ? '←' : '→';
          const tokens = h('div', { class: 'tokens' });
          cells[n] = { tokens, el: h('div', { class: `cell${STARS.has(n) ? ' star' : ''}${n === GOAL ? ' goal' : ''}`, style: `grid-row:${r};grid-column:${c}` }, [
            h('span', { class: 'num' }, String(n)), dir ? h('span', { class: 'dir', 'aria-hidden': 'true' }, dir) : null,
            mark ? h('span', { class: 'mark' }, mark) : null, tokens]) };
          grid.append(cells[n].el);
        }
        // 梯子＝兩條軌道＋橫檔；蛇＝波浪身體＋頭
        const NS = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(NS, 'svg');
        svg.setAttribute('class', 'links'); svg.setAttribute('viewBox', '0 0 600 500'); svg.setAttribute('aria-hidden', 'true');
        const ctr = (n) => { const [r, c] = cellRC(n); return [(c - 0.5) * 100, (r - 0.5) * 100]; };
        const el = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); svg.append(e); return e; };
        Object.entries(LADDERS).forEach(([a, b]) => {
          const [x1, y1] = ctr(+a), [x2, y2] = ctr(+b);
          const len = Math.hypot(x2 - x1, y2 - y1), nx = -(y2 - y1) / len * 12, ny = (x2 - x1) / len * 12;
          for (const s of [1, -1]) el('line', { x1: x1 + nx * s, y1: y1 + ny * s, x2: x2 + nx * s, y2: y2 + ny * s, stroke: '#8a5a2b', 'stroke-width': 6, 'stroke-linecap': 'round', opacity: .75 });
          const k = Math.floor(len / 28);
          for (let i = 1; i < k; i++) { const t = i / k; const x = x1 + (x2 - x1) * t, y = y1 + (y2 - y1) * t; el('line', { x1: x + nx, y1: y + ny, x2: x - nx, y2: y - ny, stroke: '#b07a3c', 'stroke-width': 5, opacity: .75 }); }
        });
        Object.entries(visualSnakes).forEach(([a, b]) => {
          const [x1, y1] = ctr(+a), [x2, y2] = ctr(+b);
          const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
          el('path', { d: `M${x1} ${y1} Q${mx + 40} ${my - 20} ${mx} ${my} T${x2} ${y2}`, stroke: '#2f8a4c', 'stroke-width': 12, fill: 'none', 'stroke-linecap': 'round', opacity: .7 });
          el('circle', { cx: x1, cy: y1, r: 13, fill: '#2f8a4c', opacity: .85 });
          el('circle', { cx: x1 - 4, cy: y1 - 3, r: 2.5, fill: '#fff' }); el('circle', { cx: x1 + 4, cy: y1 - 3, r: 2.5, fill: '#fff' });
        });
        const die = die3d(); let mover = -1;
        const actBtn = h('button', { class: 'btn primary', type: 'button', onclick: () => play() }, '答題，再擲骰子');
        const nowPos = h('div', { class: 'now-pos' });
        const log = h('div', { class: 'log', role: 'status', 'aria-live': 'polite' });
        const teamBar = h('div', { class: 'teams' });
        const goalEl = h('div', { class: 'note' });
        const side = h('div', { class: 'side' }, [teamBar, nowPos, die, actBtn, log, goalEl, h('div', { class: 'legend' }, '🪜 答對才能爬｜🐍 答對能躲開｜⭐ 答對多走 1 格')]);
        const boardHost = h('div', {}, h('div', { class: 'tilt' }, h('div', { class: 'sb tilted' }, [grid, svg])));
        app.replaceChildren(header(bank, '語文蛇梯棋'), h('div', { class: 'play' }, [boardHost, side]));
        const view = window.RG3D?.mount({ kind: 'snakes', host: boardHost, onMode: (active) => die.classList.toggle('rg3d-result', active), ladders: LADDERS, snakes: visualSnakes,
          cells: Array.from({ length: GOAL }, (_, i) => {
            const n = i + 1, [r, c] = cellRC(n);
            return { id: n, row: r - 1, col: c - 1, label: String(n), direction: n === GOAL ? '🏆' : n % 6 === 0 ? '↑' : Math.floor((n - 1) / 6) % 2 ? '←' : '→',
              color: n === GOAL ? '#ffe0a1' : STARS.has(n) ? '#fff1c2' : n % 2 ? '#fffaf3' : '#f3e8d3',
              detail: LADDERS[n] ? `梯 → ${LADDERS[n]}` : SNAKES[n] ? `蛇 → ${visualSnakes[n]}` : STARS.has(n) ? '多走1格' : null };
          })
        });
        players.forEach((p, i) => view?.moveToken(i, p.at, { instant: true }));

        function render() {
          const p = players[turn];
          teamBar.replaceChildren(...players.map((pl, i) => h('div', { class: `team${i === turn ? ' now' : ''}` }, [
            token(i), ` ${pl.name}：第 ${pl.at} 格`])));
          nowPos.textContent = `${cap ? `第 ${roundNo} / ${cap} 回合｜` : ''}${p.name}在第 ${p.at} 格`;
          for (let n = 1; n <= GOAL; n++) {
            cells[n].el.classList.toggle('here', p.at === n);
            cells[n].tokens.replaceChildren(...players.map((pl, i) => pl.at === n ? token(i, i === mover ? 'hop' : '') : null).filter(Boolean));
          }
          goalEl.textContent = `全班合作目標：一起完成 ${Math.max(8, players.length * 4)} 題（已完成 ${stats.independent + stats.helped + stats.learned} 題）`;
        }
        const say = (m) => { log.textContent = m; speak(m); };
        // 2D 與 3D 同步顯示足跡與步數（梯子 ↑、蛇 ↓），並念出 1、2、3…
        const trail = [];
        function markStep(i, n, k) {
          const el = cells[n].el; el.style.setProperty('--tc', TEAM_COLORS[i]); el.dataset.step = k; el.classList.add('trail'); trail.push(el);
          view?.stepMark(i, n, k); if (typeof k === 'number') speak(String(k));
        }
        function clearTrail() { trail.splice(0).forEach((el) => { el.classList.remove('trail'); delete el.dataset.step; }); view?.clearMarks(); }
        const walk = async (p, to, path) => {
          mover = players.indexOf(p);
          view?.focusPlayer(mover, to);
          if (path && view?.active) {
            await view.moveToken(mover, to, { path }); p.at = to; render(); markStep(mover, to, path === 'ladder' ? '↑' : '↓');
          } else {
            const step = to > p.at ? 1 : -1; let k = 0;
            while (p.at !== to) { p.at += step; k++; render(); markStep(mover, p.at, path ? '' : k); await Promise.all([sleep(path ? 300 : 560), view?.moveToken(mover, p.at)]); }
          }
          mover = -1;
        };

        async function play() {
          if (busy) return; busy = true; actBtn.disabled = true;
          const p = players[turn];
          const r = await ask(deck.draw(), settings, { title: `${p.name}：先答題，再擲骰子`, deck });
          p.asked++; if (r.correct) p.right++;
          const n = 1 + Math.floor(Math.random() * 6); await Promise.all([die.roll(n), view?.rollDice(n)]);
          mover = turn;
          clearTrail();
          say(`${p.name}擲出 ${n} 點，往前走 ${n} 格！`);
          await sleep(1200);
          await walk(p, Math.min(GOAL, p.at + n));
          await sleep(500);
          if (LADDERS[p.at]) {
            if (r.correct) { say(`踩到梯子！剛剛答對，沿著梯子爬到第 ${LADDERS[p.at]} 格！`); await sleep(1400); await walk(p, LADDERS[p.at], 'ladder'); say(`剛剛答對，${p.name}爬上梯子到第 ${p.at} 格！`); } else say('梯子要答對才能爬，下次就可以！');
          } else if (SNAKES[p.at]) {
            if (r.correct) say('剛剛答對，躲開蛇了！');
            else { const to = Math.max(SNAKES[p.at], p.at - maxSlide); say(`踩到蛇頭了，沿著蛇往回滑到第 ${to} 格。`); await sleep(1400); await walk(p, to, 'snake'); say(`往回走到第 ${to} 格，學過的詞下次就會了。`); }
          } else if (STARS.has(p.at) && r.correct) { await walk(p, p.at + 1); say('星星格，多走 1 格！'); }
          else say(`${p.name}走到第 ${p.at} 格。`);
          render();
          const timeUp = cap && turn === players.length - 1 && roundNo >= cap;
          if (p.at >= GOAL || timeUp) {
            const best = Math.max(...players.map((x) => x.at));
            say(p.at >= GOAL ? `🏆 ${p.name}抵達終點！` : `回合結束！走最遠的是${players.filter((x) => x.at === best).map((x) => x.name).join('和')}。`);
            side.append(h('div', { class: 'where', style: 'font-weight:800' }, `📒 學習紀錄：${statsLine()}`),
              h('button', { class: 'btn primary', type: 'button', onclick: () => location.reload() }, '再玩一次'));
            return;
          }
          turn = (turn + 1) % players.length; if (turn === 0) roundNo++; render();
          view?.focusPlayer(turn, players[turn].at);
          busy = false; actBtn.disabled = false; actBtn.focus();
        }
        render(); view?.focusPlayer(turn, players[turn].at); actBtn.focus();
      }
    }).catch((e) => { document.getElementById('app').textContent = e.message; });
  </script>
</body>
</html>

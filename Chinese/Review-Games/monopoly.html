<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>課文大富翁</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="common.css?v=11">
  <style>
    .play { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 14px; align-items: start; }
    @media (max-width: 900px) { .play { grid-template-columns: 1fr; } }
    .board { display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(6, 1fr); gap: 6px; aspect-ratio: 1; width: min(100%, calc(100vh - 110px)); min-width: min(100%, 520px); margin: 0 auto; }
    .tile { position: relative; border-radius: 12px; background: var(--card); border: 3px solid var(--line); padding: 4px 6px; font-weight: 900; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; overflow: hidden; }
    .tile .band { position: absolute; top: 0; left: 0; right: 0; height: 12px; }
    .tile .nm { font-size: clamp(14px, 2.1vw, 24px); line-height: 1.2; }
    .tile .own { position: absolute; left: 4px; top: 16px; font-size: 13px; color: #fff; border-radius: 6px; padding: 0 5px; }
    .tile.special { background: #fff3e0; }
    .tile.review { background: #eef4ff; }
    .tile .big { font-size: clamp(20px, 3vw, 34px); line-height: 1; }
    .tile.here { border-color: var(--ink); border-width: 4px; }
    .tokens { position: absolute; right: 3px; bottom: 3px; display: flex; flex-wrap: wrap; gap: 2px; justify-content: flex-end; }
    .center { grid-column: 2 / 6; grid-row: 2 / 6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 8px; }
    .where { background: var(--card); border: 3px solid var(--line); border-radius: 16px; padding: 8px 14px; font-weight: 800; font-size: 1.05rem; max-width: 100%; }
    .side { display: grid; gap: 10px; }
    .side .teams { flex-direction: column; }
    .center .log { font-size: 1.05rem; color: var(--ink); }
    @media (max-width: 600px) {
      .tile { padding: 2px; border-width: 2px; }
      .tile.special .nm, .tile.review .nm { display: none; }
      .tile .nm { font-size: 12px; }
      .center { gap: 4px; padding: 2px; }
      .center .btn { min-height: 44px; padding: 4px 12px; }
      .where, .center .log { font-size: .75rem; padding: 2px 6px; }
      .center strong { font-size: .8rem; }
    }
    /* T1B：側邊隊伍卡；保留遊戲 DOM 與按鈕行為。 */
    .side .team { --team-accent: var(--team-1); }
    .side .team:nth-child(2) { --team-accent: var(--team-2); }
    .side .team:nth-child(3) { --team-accent: var(--team-3); }
    .side .team:nth-child(4) { --team-accent: var(--team-4); }
    .play .side .team.now { border-left: 6px solid var(--team-accent); box-shadow: var(--shadow-toy); }
    .side .team > div:first-child::before { content: ""; display: inline-block; width: 34px; height: 40px; margin-right: 8px; vertical-align: middle; background: center / contain no-repeat var(--character); }
    .side .team:nth-child(1) { --character: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2048%2052%22%3E%3Cellipse%20cx%3D%2224%22%20cy%3D%2237%22%20rx%3D%2211%22%20ry%3D%2213%22%20fill%3D%22%23c0362c%22%2F%3E%3Ccircle%20cx%3D%2224%22%20cy%3D%2222%22%20r%3D%2210%22%20fill%3D%22%23f1c59f%22%2F%3E%3Cellipse%20cx%3D%2224%22%20cy%3D%2214%22%20rx%3D%2216%22%20ry%3D%224%22%20fill%3D%22%23e8d4aa%22%2F%3E%3Cpath%20d%3D%22M14%2013Q15%200%2024%203Q34%200%2034%2013%22%20fill%3D%22%23e8d4aa%22%2F%3E%3Crect%20x%3D%228%22%20y%3D%2229%22%20width%3D%227%22%20height%3D%2215%22%20rx%3D%222%22%20fill%3D%22%238a5a33%22%2F%3E%3Ccircle%20cx%3D%2220%22%20cy%3D%2222%22%20r%3D%221.6%22%20fill%3D%22%232b1d12%22%2F%3E%3Ccircle%20cx%3D%2228%22%20cy%3D%2222%22%20r%3D%221.6%22%20fill%3D%22%232b1d12%22%2F%3E%3C%2Fsvg%3E"); }
    .side .team:nth-child(2) { --character: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2048%2052%22%3E%3Crect%20x%3D%2212%22%20y%3D%2227%22%20width%3D%2224%22%20height%3D%2220%22%20rx%3D%225%22%20fill%3D%22%231f5fa8%22%2F%3E%3Crect%20x%3D%229%22%20y%3D%2212%22%20width%3D%2230%22%20height%3D%2219%22%20rx%3D%225%22%20fill%3D%22%231f5fa8%22%2F%3E%3Crect%20x%3D%2213%22%20y%3D%2218%22%20width%3D%2222%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22%232b1d12%22%2F%3E%3Cpath%20d%3D%22M24%2012V5%22%20stroke%3D%22%232b1d12%22%20stroke-width%3D%222%22%2F%3E%3Ccircle%20cx%3D%2224%22%20cy%3D%224%22%20r%3D%223%22%20fill%3D%22%231f5fa8%22%2F%3E%3Ccircle%20cx%3D%2220%22%20cy%3D%2222%22%20r%3D%221.6%22%20fill%3D%22%23fbf3e4%22%2F%3E%3Ccircle%20cx%3D%2228%22%20cy%3D%2222%22%20r%3D%221.6%22%20fill%3D%22%23fbf3e4%22%2F%3E%3C%2Fsvg%3E"); }
    .side .team:nth-child(3) { --character: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2048%2052%22%3E%3Cpath%20d%3D%22M15%2038L3%2045L12%2027L6%2028L11%2022L6%2018L14%2015L14%209L21%2012%22%20fill%3D%22%23fbf3e4%22%2F%3E%3Cellipse%20cx%3D%2224%22%20cy%3D%2233%22%20rx%3D%2212%22%20ry%3D%2215%22%20fill%3D%22%231f7a43%22%2F%3E%3Cellipse%20cx%3D%2225%22%20cy%3D%2219%22%20rx%3D%2212%22%20ry%3D%2211%22%20fill%3D%22%231f7a43%22%2F%3E%3Cellipse%20cx%3D%2226%22%20cy%3D%2225%22%20rx%3D%2210%22%20ry%3D%225%22%20fill%3D%22%231f7a43%22%2F%3E%3Ccircle%20cx%3D%2220%22%20cy%3D%2222%22%20r%3D%221.6%22%20fill%3D%22%232b1d12%22%2F%3E%3Ccircle%20cx%3D%2228%22%20cy%3D%2222%22%20r%3D%221.6%22%20fill%3D%22%232b1d12%22%2F%3E%3C%2Fsvg%3E"); }
    .side .team:nth-child(4) { --character: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2048%2052%22%3E%3Cpath%20d%3D%22M23%2020L4%2013L5%2038L23%2044L43%2037L44%2013L25%2020%22%20fill%3D%22%23fbf3e4%22%20stroke%3D%22%236b3fb0%22%20stroke-width%3D%223%22%2F%3E%3Cellipse%20cx%3D%2224%22%20cy%3D%2233%22%20rx%3D%2210%22%20ry%3D%2213%22%20fill%3D%22%236b3fb0%22%2F%3E%3Ccircle%20cx%3D%2224%22%20cy%3D%2220%22%20r%3D%229%22%20fill%3D%22%236b3fb0%22%2F%3E%3Cpath%20d%3D%22M24%201L26%206L31%206L27%2010L28%2015L24%2012L20%2015L21%2010L17%206L22%206%22%20fill%3D%22%23d9a441%22%2F%3E%3Ccircle%20cx%3D%2220%22%20cy%3D%2222%22%20r%3D%221.6%22%20fill%3D%22%232b1d12%22%2F%3E%3Ccircle%20cx%3D%2228%22%20cy%3D%2222%22%20r%3D%221.6%22%20fill%3D%22%232b1d12%22%2F%3E%3C%2Fsvg%3E"); }
    /* 三、四隊壓成兩欄；CSS 判斷數量，不介入遊戲狀態。 */
    .play .side .teams:has(> .team:nth-child(3)) { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
    .play:has(> .rg3d-monopoly) .side .teams:has(> .team:nth-child(3)) > .team { width:auto; min-height:0; padding:7px 6px; border-width:2px; border-radius:12px; font-size:14px; }
    .play:has(> .rg3d-monopoly) .side .teams:has(> .team:nth-child(3)) > .team.now { border-left-width:6px; }
    .side .teams:has(> .team:nth-child(3)) .team > div:first-child::before { width:20px; height:26px; margin-right:3px; }
    .side .teams:has(> .team:nth-child(3)) .team .token { width:22px; height:22px; font-size:13px; }
    .side .teams:has(> .team:nth-child(3)) .team .big { font-size:20px; line-height:1.25; }
    .side .teams:has(> .team:nth-child(3)) .team .note { font-size:11px; line-height:1.35; margin:2px 0 0; white-space:nowrap; }
    .side .teams:has(> .team:nth-child(3)) .team.now::after { font-size:12px; line-height:1.4; }
    .play .side > .rg3d-console { gap:8px; padding:10px; }
    .play .rg3d-console .where { font-size:16px; }
    .play .rg3d-console .log { font-size:14px; }
    .side .btn:not(.primary) { background: var(--surface-1); color: var(--ink); }
  </style>
</head>
<body>
  <main class="wrap" id="app"><p>載入中…</p></main>
  <script src="common.js?v=3"></script>
  <script src="rg3d-kit.js?v=1"></script>
  <script src="scene3d-monopoly.js?v=1"></script>
  <script>
    const { die3d, h, speak, sleep, loadBank, setupPanel, makeDeck, ask, header, token, statsLine, TEAM_COLORS, TEAM_NAMES } = RG;
    const PRICE = 200, TOLL = 100, PASS_GO = 200, START_CASH = 1000;
    const LESSON_COLORS = ['var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--c4)', 'var(--c5)', 'var(--c6)'];
    // 20 格：起點、6 課各 2 塊地、機會 4、命運 2、休息站 1。沒勾選的課，地改成「綜合複習」格。
    const LAYOUT = ['start', 1, 1, 'chance', 2, 2, 'fate', 3, 3, 'chance', 'rest', 4, 4, 'chance', 5, 5, 'fate', 6, 6, 'chance'];
    // 命運都是中性或正向事件，不扣錢、不道德化
    const FATE = [
      ['幫同學撿起掉落的鉛筆，獲得', 100], ['整理好書包，獲得', 100], ['準時交作業，獲得', 150],
      ['上課分享好點子，獲得', 120], ['發現閱讀角，坐下來休息一下。', 0], ['在走廊遇到校長說早安，獲得', 50],
    ];
    const pos = (i) => i <= 5 ? [1, i + 1] : i <= 10 ? [i - 4, 6] : i <= 15 ? [6, 16 - i] : [21 - i, 1];

    loadBank().then((bank) => {
      const app = document.getElementById('app');
      const teamsSel = h('select', { 'aria-label': '隊伍數' }, [2, 3, 4].map((n) => h('option', { value: n }, `${n} 隊`)));
      const roundsSel = h('select', { 'aria-label': '回合數' }, [4, 6, 8, 10].map((n) => h('option', { value: n, selected: n === 6 }, `${n} 回合`)));
      const { el: panel, settings } = setupPanel(bank, { howto: [['🎲', '擲骰子，走到格子上'], ['❓', '回答一題'], ['🏠', '答對就買地、得學習章']], extra: [h('div', { class: 'row' }, [h('strong', {}, '隊伍'), teamsSel, h('strong', {}, '長度'), roundsSel])] });
      const msg = h('p', { class: 'note', role: 'alert' });
      const rules = h('details', {}, [h('summary', { style: 'font-weight:800;cursor:pointer' }, '玩法說明（教師）'),
        h('p', { class: 'note' }, `每隊起始 ${START_CASH} 元。踩到沒人買的課次地：答對（含看線索後答對）就能用 ${PRICE} 元買下；錢不夠也一樣要答題，答對得學習章。踩到別隊的地：答對免付過路費 ${TOLL} 元（同一課兩塊都買下加倍）。藍色「綜合複習」格是沒勾選的課，答對得 50 元。機會格答對得 150 元。結束時分開列出「財富」與「學習紀錄」。`)]);
      app.replaceChildren(header(bank, '課文大富翁'), panel, rules, msg, h('div', { class: 'row' }, h('button', { class: 'btn primary', type: 'button', onclick: () => start() }, '開始遊戲')));

      function start() {
        const deck = makeDeck(bank, settings);
        if (!deck.size()) { msg.textContent = '請至少勾選一課和一種題目類型。'; panel.querySelector('input').focus(); return; }
        const nTeams = Number(teamsSel.value);
        const maxRounds = Number(roundsSel.value);
        const teams = Array.from({ length: nTeams }, (_, i) => ({ name: TEAM_NAMES[i], color: TEAM_COLORS[i], cash: START_CASH, at: 0, stamps: 0 }));
        const kindOf = (t) => typeof t === 'number' && !(settings.lessons.has(t) && deck.size((q) => q.lesson === t)) ? 'review' : t;
        const owner = {};
        let turn = 0, round = 1, busy = false;
        const title = (l) => bank.lessons[l - 1].title;
        const tiles = LAYOUT.map((t, i) => {
          const [r, c] = pos(i);
          const tokens = h('div', { class: 'tokens' });
          const kind = kindOf(t);
          if (kind === 'review') {
            return { tokens, el: h('div', { class: 'tile review', style: `grid-row:${r};grid-column:${c}` }, [h('div', { class: 'big', 'aria-hidden': 'true' }, '📚'), h('div', { class: 'nm' }, '綜合複習'), tokens]) };
          }
          if (typeof t === 'number') {
            const own = h('span', { class: 'own hidden' });
            const el = h('div', { class: 'tile', style: `grid-row:${r};grid-column:${c}` }, [h('div', { class: 'band', style: `background:${LESSON_COLORS[t - 1]}` }), h('div', { class: 'nm' }, `第${t}課`), own, tokens]);
            return { el, tokens, own };
          }
          const label = { start: ['🏁', '起點'], chance: ['❓', '機會'], fate: ['🎲', '命運'], rest: ['☕', '休息站'] }[t];
          const el = h('div', { class: 'tile special', style: `grid-row:${r};grid-column:${c}` }, [h('div', { class: 'big', 'aria-hidden': 'true' }, label[0]), h('div', { class: 'nm' }, label[1]), tokens]);
          return { el, tokens };
        });
        const die = die3d(); let mover = -1;
        const log = h('div', { class: 'log', role: 'status', 'aria-live': 'polite' }, '');
        const where = h('div', { class: 'where' });
        const rollBtn = h('button', { class: 'btn primary', type: 'button', onclick: () => play() }, '擲骰子');
        const roundEl = h('strong', {});
        const center = h('div', { class: 'center' }, [roundEl, die, rollBtn, where, log]);
        const board = h('div', { class: 'board tilted' }, [...tiles.map((t) => t.el), center]);
        const teamBar = h('div', { class: 'teams' });
        const side = h('div', { class: 'side' }, [teamBar]);
        const boardHost = h('div', {}, h('div', { class: 'tilt' }, board));
        app.replaceChildren(header(bank, '課文大富翁'), h('div', { class: 'play' }, [boardHost, side]));
        const view = window.RG3DMonopoly?.mount({ host: boardHost,
          cells: LAYOUT.map((t, i) => {
            const [r, c] = pos(i), [nr, nc] = pos((i + 1) % LAYOUT.length), kind = kindOf(t);
            return { id: i, row: r - 1, col: c - 1, direction: nr > r ? '↓' : nr < r ? '↑' : nc > c ? '→' : '←',
              label: kind === 'review' ? '綜合複習' : typeof t === 'number' ? `第${t}課` : { start: '起點', chance: '機會', fate: '命運', rest: '休息站' }[t],
              color: kind === 'review' ? '#e3edfc' : typeof t === 'number' ? '#fffaf3' : '#ffe6b7',
              band: typeof kind === 'number' ? getComputedStyle(document.body).getPropertyValue(`--c${t}`).trim() : null };
          }),
          onMode: (active) => {
            die.classList.toggle('rg3d-result', active);
            const focused = document.activeElement;
            center.classList.toggle('rg3d-console', active);
            if (active) side.append(center); else board.append(center);
            if (focused && center.contains(focused)) focused.focus({ preventScroll: true });
          }
        });
        teams.forEach((t, i) => view?.moveToken(i, t.at, { instant: true }));

        const propCount = (ti) => Object.values(owner).filter((o) => o === ti).length;
        function tileName(i) {
          const t = LAYOUT[i]; const k = kindOf(t);
          if (k === 'review') return '綜合複習';
          if (typeof t === 'number') return `第${t}課 ${title(t)}`;
          return { start: '起點', chance: '機會', fate: '命運', rest: '休息站' }[t];
        }
        function render() {
          roundEl.textContent = `第 ${round} / ${maxRounds} 回合`;
          where.textContent = `輪到${teams[turn].name}｜在：${tileName(teams[turn].at)}`;
          teamBar.replaceChildren(...teams.map((t, i) => h('div', { class: `team${i === turn ? ' now' : ''}` }, [
            h('div', {}, [token(i), ' ', t.name]),
            h('div', { class: 'big' }, `${t.cash} 元`), h('div', { class: 'note' }, `地產 ${propCount(i)} 塊｜學習章 ${t.stamps}`)])));
          tiles.forEach((t, i) => {
            t.el.classList.toggle('here', teams[turn].at === i);
            t.tokens.replaceChildren(...teams.map((tm, k) => tm.at === i ? token(k, k === mover ? 'hop' : '') : null).filter(Boolean));
            if (t.own) {
              const o = owner[i];
              t.own.classList.toggle('hidden', o == null);
              if (o != null) { t.own.textContent = `${o + 1}隊`; t.own.style.background = teams[o].color; }
            }
          });
        }
        const say = (m) => { log.textContent = m; speak(m); };
        // 2D 與 3D 同步顯示足跡與步數，並念出 1、2、3…
        const trail = [];
        function markStep(i, cell, k) {
          const el = tiles[cell].el; el.style.setProperty('--tc', TEAM_COLORS[i]); el.dataset.step = k; el.classList.add('trail'); trail.push(el);
          view?.stepMark(i, cell, k); speak(String(k));
        }
        function clearTrail() { trail.splice(0).forEach((el) => { el.classList.remove('trail'); delete el.dataset.step; }); view?.clearMarks(); }
        const quiz = async (team, pref, t) => {
          const r = await ask(deck.draw(pref), settings, { title: t, deck });
          if (r.correct) team.stamps++;
          return r;
        };

        async function play() {
          if (busy) return; busy = true; rollBtn.disabled = true;
          const team = teams[turn];
          const n = 1 + Math.floor(Math.random() * 6);
          await Promise.all([die.roll(n), view?.rollDice(n)]);
          mover = turn;
          clearTrail();
          say(`${team.name}擲出 ${n} 點，往前走 ${n} 格！`);
          await sleep(1200);
          for (let k = 0; k < n; k++) {
            team.at = (team.at + 1) % LAYOUT.length;
            if (team.at === 0) team.cash += PASS_GO;
            render(); view?.focusPlayer(turn, team.at);
            markStep(turn, team.at, k + 1);
            await Promise.all([sleep(560), view?.moveToken(turn, team.at)]);
          }
          await sleep(500);
          mover = -1;
          const t = LAYOUT[team.at];
          const kind = kindOf(t);
          if (kind === 'review') {
            if ((await quiz(team, null, `${team.name}：綜合複習，答對得 50 元`)).correct) { team.cash += 50; say('得到 50 元！'); } else say('一起學過了，下次就會了！');
          } else if (typeof t === 'number') {
            const o = owner[team.at];
            const pref = (x) => x.lesson === t;
            if (o == null) {
              const canBuy = team.cash >= PRICE;
              const r = await quiz(team, pref, canBuy ? `${team.name}：答對就能用 ${PRICE} 元買下「第${t}課」這塊地` : `${team.name}：錢不夠買地，答對一樣得學習章`);
              if (r.correct && canBuy) { team.cash -= PRICE; owner[team.at] = turn; view?.setOwner(team.at, turn); say(`${team.name}買下第${t}課的地！`); } else say(r.correct ? '得到學習章！' : '一起學過了，這次先不買。');
            } else if (o === turn) {
              if ((await quiz(team, pref, `${team.name}回到自己的地，答對得複習獎金 50 元`)).correct) { team.cash += 50; say('複習獎金 50 元！'); } else say('一起學過了！');
            } else {
              const pair = LAYOUT.map((x, i) => x === t ? i : -1).filter((i) => i >= 0);
              const toll = pair.every((i) => owner[i] === o) ? TOLL * 2 : TOLL;
              if ((await quiz(team, pref, `這是${teams[o].name}的地。答對免付過路費，沒答對付 ${toll} 元`)).correct) say('答對了，免費通過！');
              else { const pay = Math.min(toll, team.cash); team.cash -= pay; teams[o].cash += pay; say(`付給${teams[o].name} ${pay} 元。`); }
            }
          } else if (t === 'chance') {
            if ((await quiz(team, null, `${team.name}抽到機會：答對得 150 元`)).correct) { team.cash += 150; say('得到 150 元！'); } else say('一起學過了，下次加油！');
          } else if (t === 'fate') {
            const [m, amt] = FATE[Math.floor(Math.random() * FATE.length)];
            team.cash += amt;
            say(amt ? `命運：${m} ${amt} 元。` : `命運：${m}`);
          } else if (t === 'rest') say(`${team.name}在休息站喝口水。`);
          else say(`${team.name}回到起點！`);
          turn = (turn + 1) % teams.length;
          if (turn === 0) round++;
          render();
          if (round > maxRounds) return finish();
          view?.focusPlayer(turn, teams[turn].at);
          busy = false; rollBtn.disabled = false; rollBtn.focus();
        }

        function finish() {
          view?.presentFinish();
          const scores = teams.map((t, i) => ({ ...t, total: t.cash + propCount(i) * PRICE, props: propCount(i) })).sort((a, b) => b.total - a.total);
          const best = scores[0].total;
          center.replaceChildren(
            h('strong', { style: 'font-size:1.3rem' }, '🎉 遊戲結束'),
            h('div', { style: 'font-weight:800' }, '💰 財富'),
            ...scores.map((s) => h('div', {}, `${s.total === best ? '🏆 ' : ''}${s.name}：現金 ${s.cash}＋地產 ${s.props} 塊 ＝ ${s.total}`)),
            h('div', { style: 'font-weight:800' }, '📒 學習紀錄（全班）'),
            h('div', {}, statsLine()),
            h('div', { class: 'note' }, teams.map((t) => `${t.name} 學習章 ${t.stamps}`).join('｜')),
            h('button', { class: 'btn primary', type: 'button', onclick: () => location.reload() }, '再玩一次'),
          );
          speak(`遊戲結束，${scores.filter((s) => s.total === best).map((s) => s.name).join('和')}財富最多！大家一起學了好多語詞。`);
        }
        render(); view?.focusPlayer(turn, teams[turn].at);
        rollBtn.focus();
      }
    }).catch((e) => { document.getElementById('app').textContent = e.message; });
  </script>
</body>
</html>

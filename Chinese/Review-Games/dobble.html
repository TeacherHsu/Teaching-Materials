<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>語詞哆寶</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="common.css">
  <style>
    .stage { display: flex; justify-content: center; gap: 20px; margin: 12px 0; }
    .card { flex: 0 1 440px; display: grid; gap: 8px; justify-items: center; }
    .disc { position: relative; width: min(440px, 44vw); aspect-ratio: 1; border-radius: 50%; background: #fff; border: 6px solid var(--brand); box-shadow: 0 10px 30px rgba(0,0,0,.12); }
    .card.b .disc { border-color: var(--c4); }
    .sym { position: absolute; transform: translate(-50%, -50%) rotate(var(--r)); min-width: 64px; min-height: 52px; border: 3px solid var(--line); background: #fff6e8; border-radius: 14px; padding: 4px 12px; font-weight: 900; color: var(--ink); white-space: nowrap; }
    .sym.bad { animation: shake .35s; border-color: var(--bad); border-style: dashed; }
    .sym.ok { background: #c9f0d6; border-color: var(--ok); border-width: 4px; }
    @keyframes shake { 25% { transform: translate(-56%, -50%) rotate(var(--r)); } 75% { transform: translate(-44%, -50%) rotate(var(--r)); } }
    /* 窄螢幕（iPad 直向、手機）：改成並排矩形卡、固定詞槽、不旋轉 */
    @media (max-width: 760px) {
      .stage { gap: 10px; }
      .card { flex: 1 1 0; min-width: 0; }
      .disc { width: 100%; aspect-ratio: auto; border-radius: 20px; display: grid; gap: 8px; padding: 10px; }
      .sym { position: static; transform: none !important; white-space: normal; font-size: 1.15rem !important; min-width: 0; padding: 4px 6px; }
      .disc { border-width: 4px; padding: 6px; }
    }
    .bar { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; justify-content: center; font-weight: 800; font-size: 1.1rem; }
    .reveal { text-align: center; min-height: 3.4em; font-size: 1.15rem; font-weight: 800; display: grid; gap: 10px; justify-items: center; }
    .mcq { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .mcq .qopt { max-width: 420px; }
  </style>
</head>
<body>
  <main class="wrap" id="app"><p>載入中…</p></main>
  <script src="common.js"></script>
  <script>
    const { h, shuffle, speak, speakBtn, loadBank, setupPanel, header } = RG;
    const SIZE = { support: 4, standard: 6, challenge: 8 };
    const ROT = { support: 0, standard: 10, challenge: 25 };
    const FONT = { support: 1.6, standard: 1.4, challenge: 1.25 };

    loadBank().then((bank) => {
      const app = document.getElementById('app');
      const roundsSel = h('select', { 'aria-label': '回數' }, [5, 10].map((n) => h('option', { value: n }, `${n} 回`)));
      const { el: panel, settings } = setupPanel(bank, { types: [], levelNote: '支持：每張 4 個詞、不旋轉｜標準：6 個詞｜挑戰：8 個詞（加入成語）。都不限時。', extra: [h('div', { class: 'row' }, [h('strong', {}, '長度'), roundsSel])] });
      const msg = h('p', { class: 'note', role: 'alert' });
      app.replaceChildren(header(bank, '語詞哆寶'), panel,
        h('p', { class: 'note' }, '兩張卡上只有「一個」語詞完全相同，看到就點它，然後想一想它的意思。小心每個字都要看清楚！'),
        msg, h('div', { class: 'row' }, h('button', { class: 'btn primary', type: 'button', onclick: () => start() }, '開始遊戲')));

      function start() {
        const k = SIZE[settings.level];
        const ROUNDS = Number(roundsSel.value);
        const items = [
          ...bank.words.filter((w) => settings.lessons.has(w.lesson)).map((w) => ({ text: w.word, meaning: w.meaning, lesson: w.lesson })),
          ...(settings.level === 'challenge' ? bank.idioms.filter((i) => settings.lessons.has(i.lesson)).map((i) => ({ text: i.idiom, meaning: i.definition, lesson: i.lesson })) : []),
        ].filter((x, i, a) => a.findIndex((y) => y.text === x.text) === i);
        if (items.length < k * 2) { msg.textContent = '勾選的課太少，請多選幾課。'; return; }
        let round = 0, misses = 0, current = null, locked = false, roundMiss = 0;
        let targets = shuffle(items); const again = []; const practiced = []; const toPractice = [];
        const discA = h('div', { class: 'disc', role: 'group', 'aria-label': '左邊卡片' });
        const discB = h('div', { class: 'disc', role: 'group', 'aria-label': '右邊卡片' });
        const listen = (disc) => h('button', { class: 'btn', type: 'button', onclick: () => speak([...disc.querySelectorAll('.sym')].map((s) => s.textContent).join('，')) }, '🔊 聽這張卡');
        const status = h('div', { class: 'bar' });
        const reveal = h('div', { class: 'reveal', role: 'status', 'aria-live': 'polite' });
        const nextBtn = h('button', { class: 'btn primary hidden', type: 'button', onclick: () => deal() }, '下一回');
        app.replaceChildren(header(bank, '語詞哆寶'), status,
          h('div', { class: 'stage' }, [h('div', { class: 'card' }, [discA, listen(discA)]), h('div', { class: 'card b' }, [discB, listen(discB)])]),
          reveal, h('div', { class: 'row', style: 'justify-content:center' }, nextBtn));

        // 共有字越多越像，優先挑來當干擾，讓學生把每個字都看清楚
        const overlap = (a, b) => [...a].filter((ch) => b.includes(ch)).length;
        function nextTarget() {
          const due = again.findIndex((a) => a.due <= round);
          if (due >= 0) return again.splice(due, 1)[0].it;
          if (!targets.length) targets = shuffle(items);
          return targets.pop();
        }
        function pickRound() {
          const target = nextTarget();
          const others = shuffle(items.filter((x) => x.text !== target.text))
            .sort((a, b) => overlap(b.text, target.text) - overlap(a.text, target.text));
          const pool = shuffle([...others.slice(0, k), ...others.slice(k, k * 3)]).slice(0, (k - 1) * 2);
          return { target, a: shuffle([target, ...pool.slice(0, k - 1)]), b: shuffle([target, ...pool.slice(k - 1)]) };
        }
        // 固定詞槽：4 個＝四象限；6、8 個＝中心 1 個＋外圈平均分布。不隨機位置，避免重疊。
        function slots(n) {
          if (n === 4) return [[30, 30], [70, 30], [30, 70], [70, 70]];
          const ring = n - 1;
          return [[50, 50], ...Array.from({ length: ring }, (_, i) => { const a = -Math.PI / 2 + (2 * Math.PI * i) / ring; return [50 + 33 * Math.cos(a), 50 + 33 * Math.sin(a)]; })];
        }
        function layout(disc, list) {
          disc.replaceChildren();
          disc.style.gridTemplateColumns = list.length > 4 ? '1fr 1fr' : '1fr';
          const pos = slots(list.length);
          const rot = ROT[settings.level];
          list.forEach((it, i) => {
            const [x, y] = pos[i];
            const fs = FONT[settings.level] * (it.text.length >= 4 ? 0.85 : 1);
            disc.append(h('button', { class: 'sym', type: 'button', style: `left:${x}%;top:${y}%;--r:${rot ? Math.round(Math.random() * rot * 2 - rot) : 0}deg;font-size:${fs.toFixed(2)}rem`, onclick: (e) => pick(it, e.currentTarget) }, it.text));
          });
        }
        function deal() {
          if (round >= ROUNDS) return finish();
          round++; locked = false; roundMiss = 0; nextBtn.classList.add('hidden'); reveal.replaceChildren();
          current = pickRound();
          layout(discA, current.a); layout(discB, current.b);
          renderStatus();
          if (settings.autoSpeak) speak('找一找，兩張卡片哪個語詞一樣？');
          discA.querySelector('.sym').focus();
        }
        function renderStatus() { status.replaceChildren(h('span', {}, `第 ${round} / ${ROUNDS} 回`), h('span', {}, `已練 ${practiced.length} 個詞`)); }
        function pick(it, btn) {
          if (locked) return;
          if (it.text !== current.target.text) {
            misses++; roundMiss++;
            btn.classList.remove('bad'); void btn.offsetWidth; btn.classList.add('bad');
            if (roundMiss === 2) { reveal.replaceChildren(h('div', {}, '💡 線索：先比第一個字，再看後面的字。')); speak('線索，先比第一個字，再看後面的字'); }
            return;
          }
          locked = true;
          document.querySelectorAll('.sym').forEach((s) => { if (s.textContent === it.text) s.classList.add('ok'); });
          meaningCheck(it);
        }
        // 找到相同語詞後，再從兩個意思中選一個：確認懂詞義，不只是找相同字
        function meaningCheck(it) {
          const other = shuffle(items.filter((x) => x.meaning !== it.meaning))[0];
          const opts = shuffle([it.meaning, other.meaning]);
          const q = h('div', {}, `找到了「${it.text}」！它的意思是哪一個？`);
          const fb = h('div', { role: 'status' });
          const btns = opts.map((m) => h('button', { class: 'qopt', type: 'button', onclick: (e) => {
            btns.forEach((b) => { b.disabled = true; if (b.textContent === it.meaning) b.classList.add('ok'); });
            const ok = m === it.meaning;
            if (!ok) e.currentTarget.classList.add('bad');
            if (!ok || roundMiss) { again.push({ it, due: round + 3 }); toPractice.push(it.text); }
            practiced.push(it.text);
            fb.textContent = ok ? `✓ 對！「${it.text}」：${it.meaning}` : `一起學：「${it.text}」的意思是「${it.meaning}」`;
            speak(`${it.text}，${it.meaning}`);
            renderStatus();
            nextBtn.classList.remove('hidden'); nextBtn.focus();
          } }, m));
          reveal.replaceChildren(h('div', { class: 'row', style: 'justify-content:center' }, [q, speakBtn(`找到了，${it.text}。它的意思是哪一個？`)]), h('div', { class: 'mcq' }, btns), fb);
          if (settings.autoSpeak) speak(`找到了，${it.text}。它的意思是哪一個？`);
          btns[0].focus();
        }
        function finish() {
          const words = [...new Set(practiced)];
          const redo = [...new Set(toPractice)];
          discA.replaceChildren(); discB.replaceChildren();
          reveal.replaceChildren(
            h('div', {}, `🎉 完成 ${ROUNDS} 回！今天練過：${words.join('、')}`),
            ...(redo.length ? [h('div', {}, `還想再練：${redo.join('、')}`)] : []),
            h('details', { class: 'note' }, [h('summary', {}, '教師詳情'), `點錯 ${misses} 次`]));
          nextBtn.textContent = '再玩一次'; nextBtn.onclick = () => location.reload(); nextBtn.classList.remove('hidden');
          speak(`完成了！今天練了 ${words.length} 個詞`);
        }
        deal();
      }
    }).catch((e) => { document.getElementById('app').textContent = e.message; });
  </script>
</body>
</html>

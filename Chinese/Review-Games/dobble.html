<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>語詞哆寶</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="common.css?v=6">
  <style>
    .stage { display: flex; justify-content: center; gap: 20px; margin: 12px 0; }
    .card { flex: 0 1 440px; display: grid; gap: 8px; justify-items: center; }
    .disc { position: relative; width: min(440px, 44vw); aspect-ratio: 1; border-radius: 50%; background: #fff; border: 6px solid var(--brand); box-shadow: 0 10px 30px rgba(0,0,0,.12); }
    .card.b .disc { border-color: var(--c4); }
    .sym { position: absolute; transform: translate(-50%, -50%) rotate(var(--r)); min-width: 64px; min-height: 52px; border: 3px solid var(--line); background: #fff6e8; border-radius: 14px; padding: 4px 12px; font-weight: 900; color: var(--ink); white-space: nowrap; }
    .sym.bad { animation: shake .35s; border-color: var(--bad); border-style: dashed; }
    .sym.ok { background: #c9f0d6; border-color: var(--ok); border-width: 4px; }
    @keyframes shake { 25% { transform: translate(-56%, -50%) rotate(var(--r)); } 75% { transform: translate(-44%, -50%) rotate(var(--r)); } }
    /* 窄螢幕（iPad 直向、手機）：改成並排矩形卡、固定詞槽、不旋轉 */
    @media (max-width: 760px) {
      .stage { gap: 10px; }
      .card { flex: 1 1 0; min-width: 0; }
      .disc { width: 100%; aspect-ratio: auto; border-radius: 20px; display: grid; gap: 8px; padding: 10px; }
      .sym { position: static; transform: none !important; white-space: normal; font-size: 1.15rem !important; min-width: 64px; padding: 4px 6px; }
      .disc { border-width: 4px; padding: 6px; }
    }
    .bar { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; justify-content: center; font-weight: 800; font-size: 1.1rem; }
    .reveal { text-align: center; min-height: 3.4em; font-size: 1.15rem; font-weight: 800; display: grid; gap: 10px; justify-items: center; }
    .mcq { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .mcq .qopt { max-width: 420px; }
    .duel { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: start; }
    .duel .zone { border: 4px solid var(--line); border-radius: 22px; padding: 10px; background: var(--card); display: grid; gap: 8px; }
    .duel .zone.won { border-color: var(--ok); box-shadow: 0 0 0 5px rgba(31,138,76,.25); }
    .duel .zone.out { opacity: .6; }
    .duel .disc { width: 100%; border-radius: 20px; aspect-ratio: auto; display: grid; gap: 6px; padding: 8px; border-width: 4px; }
    .duel .card { flex: 1 1 0; min-width: 0; }
    .duel .stage { gap: 8px; margin: 0; }
    .duel .sym { position: static; transform: none !important; white-space: normal; font-size: 1.15rem !important; min-width: 64px; min-height: 52px; padding: 2px 6px; }
    .duel-head { display: flex; align-items: center; gap: 6px; font-weight: 900; font-size: 1.2rem; }
    .duel-score { margin-left: auto; color: var(--brand); }
    .duel-info { font-weight: 800; min-height: 2.6em; text-align: center; }
    .duel-center { display: grid; gap: 10px; justify-items: center; align-content: center; min-width: 120px; text-align: center; }
    .duel.face { grid-template-columns: 1fr; }
    .duel.face .zone.flip { transform: rotate(180deg); }
    @media (max-width: 900px) { .duel { grid-template-columns: 1fr; } .duel .disc { width: 100%; } }
    /* T5：紙卡厚度與清楚的詞槽，保留既有位置／旋轉運算。 */
    #app .stage { position: relative; isolation: isolate; gap: 24px; padding-top: 32px; }
    #app .stage .card { gap: 20px; transform: none; align-content: start; }
    #app .stage .card .disc { border: 3px solid #b94b42 !important; border-radius: var(--r-lg); background: #fff; box-shadow: 0 3px 0 #eee4d6, 0 6px 0 #cba9a0, 0 12px 20px #50321426; }
    #app .stage .card.b .disc { border-color: #356fa5 !important; box-shadow: 0 3px 0 #e5eaf0, 0 6px 0 #a2b8cb, 0 12px 20px #50321426; }
    #app .stage .disc .sym { min-width: 64px; min-height: 52px; color: var(--ink); background: var(--surface-1); border: 2px solid #cdb28d; border-radius: var(--r-sm); box-shadow: var(--shadow-toy); transition: box-shadow var(--dur-press), background var(--dur-press); }
    #app .stage .disc .sym:active { box-shadow: inset 0 3px 5px #50321426; background: var(--surface-2); }
    #app .stage .disc .sym.ok { background: #dcf2dd; border: 4px solid var(--success); box-shadow: 0 0 0 2px #d9a441; }
    #app .stage .card > .btn { margin-top: 4px; position: relative; z-index: 4; }
    #app .stage > .rg3d-feedback-lines { display: none; }
    /* 設計總監 2026-10-16：連線無論怎麼繞，都會穿過其他詞塊，造成「別的詞也配對」的誤讀。改為只用雙綠框＋徽章表示配對。 */
    #app .stage > .match-link { display: none !important; }
    #app .stage > .match-link-unused { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; overflow: visible; }
    .match-link path { fill: none; stroke: var(--success); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 1; animation: match-draw 400ms var(--ease-soft) both; }
    .match-badge { position: absolute; z-index: 4; top: 0; left: 50%; translate: -50% 0; padding: 4px 12px; border: 2px solid #805711; border-radius: 999px; background: var(--reward); color: var(--ink); font-weight: 900; white-space: nowrap; pointer-events: none; animation: match-badge 400ms var(--ease-pop) 400ms both; }
    @keyframes match-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes match-badge { from { opacity: 0; scale: .8; } to { opacity: 1; scale: 1; } }
    #app .duel .zone:has(.mcq .qopt):not(.out):not(.won) { border: 5px solid var(--action); box-shadow: var(--shadow-toy); }
    #app .duel .zone:has(.mcq .qopt):not(.out):not(.won) .disc { border-width: 5px !important; }
    #app .duel .zone:has(.mcq .qopt):not(.out):not(.won) .duel-head::after { content: '正在作答'; font-size: 18px; color: var(--action); }
    #app .duel-head .token { flex-shrink: 0; }
    @media (max-width: 760px) { #app .stage { gap: 12px; } #app .stage .disc { grid-template-columns: minmax(64px,1fr) !important; } }
    body.calm *, body.calm *::before, body.calm *::after { animation-duration: 0ms !important; animation-delay: 0ms !important; transition-duration: 0ms !important; transition-delay: 0ms !important; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0ms !important; animation-delay: 0ms !important; transition-duration: 0ms !important; transition-delay: 0ms !important; } }
  </style>
</head>
<body>
  <main class="wrap" id="app"><p>載入中…</p></main>
  <script src="common.js?v=3"></script>
  <script src="scene3d.js?v=6"></script>
  <script>
    const { h, shuffle, speak, speakBtn, loadBank, setupPanel, header, token } = RG;
    const SIZE = { support: 4, standard: 6, challenge: 8 };
    const ROT = { support: 0, standard: 10, challenge: 25 };
    const FONT = { support: 1.6, standard: 1.4, challenge: 1.25 };

    loadBank().then((bank) => {
      const app = document.getElementById('app');
      const roundsSel = h('select', { 'aria-label': '回數' }, [3, 5, 10].map((n) => h('option', { value: n, selected: n === 5 }, `${n} 回`)));
      const modeSel = h('select', { 'aria-label': '模式' }, [h('option', { value: 'solo' }, '1 人練習'), h('option', { value: 'duel' }, '雙人對戰'), h('option', { value: 'duel-face' }, '雙人對戰（iPad 平放、面對面）')]);
      const { el: panel, settings } = setupPanel(bank, { types: [], howto: [['👀', '看兩張卡'], ['👆', '點出一樣的語詞'], ['💬', '選出它的意思']], levelNote: '支持：每張 4 個詞、不旋轉｜標準：6 個詞｜挑戰：8 個詞（加入成語）。都不限時。', extra: [h('div', { class: 'row' }, [h('strong', {}, '模式'), modeSel, h('strong', {}, '長度'), roundsSel])] });
      const msg = h('p', { class: 'note', role: 'alert' });
      app.replaceChildren(header(bank, '語詞哆寶'), panel,
        h('p', { class: 'note' }, '兩張卡上只有「一個」語詞完全相同，看到就點它，然後想一想它的意思。小心每個字都要看清楚！'),
        msg, h('div', { class: 'row' }, h('button', { class: 'btn primary', type: 'button', onclick: () => start() }, '開始遊戲')));

      function start() {
        const k = SIZE[settings.level];
        const ROUNDS = Number(roundsSel.value);
        const items = [
          ...bank.words.filter((w) => settings.lessons.has(w.lesson)).map((w) => ({ text: w.word, meaning: w.meaning, lesson: w.lesson })),
          ...(settings.level === 'challenge' ? bank.idioms.filter((i) => settings.lessons.has(i.lesson)).map((i) => ({ text: i.idiom, meaning: i.definition, lesson: i.lesson })) : []),
        ].filter((x, i, a) => a.findIndex((y) => y.text === x.text) === i);
        if (items.length < k * 2) { msg.textContent = '勾選的課太少，請多選幾課。'; return; }
        let round = 0, misses = 0, current = null, locked = false, roundMiss = 0;
        let targets = shuffle(items); const again = []; const practiced = []; const toPractice = [];
        const discA = h('div', { class: 'disc', role: 'group', 'aria-label': '左邊卡片' });
        const discB = h('div', { class: 'disc', role: 'group', 'aria-label': '右邊卡片' });
        const listen = (disc) => h('button', { class: 'btn', type: 'button', onclick: () => speak([...disc.querySelectorAll('.sym')].map((s) => s.textContent).join('，')) }, '🔊 聽這張卡');
        const status = h('div', { class: 'bar' });
        let soloView;
        const reveal = h('div', { class: 'reveal', role: 'status', 'aria-live': 'polite' });
        const nextBtn = h('button', { class: 'btn primary hidden', type: 'button', onclick: () => deal() }, '下一回');
        app.replaceChildren(header(bank, '語詞哆寶'), status,
          h('div', { class: 'stage' }, [h('div', { class: 'card' }, [discA, listen(discA)]), h('div', { class: 'card b' }, [discB, listen(discB)])]),
          reveal, h('div', { class: 'row', style: 'justify-content:center' }, nextBtn));



        // 共有字越多越像，優先挑來當干擾，讓學生把每個字都看清楚
        const overlap = (a, b) => [...a].filter((ch) => b.includes(ch)).length;
        function nextTarget() {
          const due = again.findIndex((a) => a.due <= round);
          if (due >= 0) return again.splice(due, 1)[0].it;
          if (!targets.length) targets = shuffle(items);
          return targets.pop();
        }
        function pickRound() {
          const target = nextTarget();
          const others = shuffle(items.filter((x) => x.text !== target.text))
            .sort((a, b) => overlap(b.text, target.text) - overlap(a.text, target.text));
          const pool = shuffle([...others.slice(0, k), ...others.slice(k, k * 3)]).slice(0, (k - 1) * 2);
          return { target, a: shuffle([target, ...pool.slice(0, k - 1)]), b: shuffle([target, ...pool.slice(k - 1)]) };
        }
        // 固定詞槽：4 個＝四象限；6、8 個＝中心 1 個＋外圈平均分布。不隨機位置，避免重疊。
        function slots(n) {
          if (n === 4) return [[30, 30], [70, 30], [30, 70], [70, 70]];
          const ring = n - 1;
          return [[50, 50], ...Array.from({ length: ring }, (_, i) => { const a = -Math.PI / 2 + (2 * Math.PI * i) / ring; return [50 + 33 * Math.cos(a), 50 + 33 * Math.sin(a)]; })];
        }
        function layout(disc, list, onPick = pick) {
          clearMatch(disc.closest('.stage'));
          disc.replaceChildren();
          disc.classList.remove('deal'); void disc.offsetWidth; disc.classList.add('deal');
          disc.style.gridTemplateColumns = list.length > 4 ? '1fr 1fr' : '1fr';
          const pos = slots(list.length);
          const rot = ROT[settings.level];
          list.forEach((it, i) => {
            const [x, y] = pos[i];
            const fs = FONT[settings.level] * (it.text.length >= 4 ? 0.85 : 1);
            disc.append(h('button', { class: 'sym', type: 'button', style: `left:${x}%;top:${y}%;--r:${rot ? Math.round(Math.random() * rot * 2 - rot) : 0}deg;font-size:${fs.toFixed(2)}rem`, onclick: (e) => onPick(it, e.currentTarget) }, it.text));
          });
        }
        function clearMatch(stage) {
          stage.querySelectorAll('.match-link,.match-badge').forEach((el) => el.remove());
          stage.matchResize?.disconnect();
        }
        function showMatch(discA, discB) {
          const stage = discA.closest('.stage');
          clearMatch(stage);
          const a = discA.querySelector('.sym.ok'), b = discB.querySelector('.sym.ok');
          if (!a || !b) return;
          const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          svg.classList.add('match-link'); svg.setAttribute('aria-hidden', 'true');
          const path = document.createElementNS(svg.namespaceURI, 'path');
          path.setAttribute('pathLength', '1');
          // 遮罩保護每個詞塊與朗讀按鈕，曲線不會覆蓋任何字。
          const mask = document.createElementNS(svg.namespaceURI, 'mask');
          const maskId = `match-mask-${showMatch.sequence = (showMatch.sequence || 0) + 1}`;
          mask.id = maskId; mask.setAttribute('maskUnits', 'userSpaceOnUse');
          const defs = document.createElementNS(svg.namespaceURI, 'defs'); defs.append(mask);
          path.setAttribute('mask', `url(#${maskId})`); svg.append(defs, path);
          const badge = h('div', { class: 'match-badge', role: 'status' }, '✓ 配對成功');
          stage.append(svg, badge);
          function draw() {
            const box = stage.getBoundingClientRect();
            const ar = a.getBoundingClientRect(), br = b.getBoundingClientRect();
            // 從兩個詞塊底部出發、繞到卡牌下方再相連（U 形），不穿過其他詞塊，避免誤以為別的詞也配對。
            const cards = [...stage.querySelectorAll('.card')].map((n) => n.getBoundingClientRect());
            const cardBottom = Math.max(ar.bottom, br.bottom, ...cards.map((r) => r.bottom));
            let x1 = ar.left + ar.width / 2 - box.left, x2 = br.left + br.width / 2 - box.left;
            let y1 = ar.bottom - box.top, y2 = br.bottom - box.top, dip = Math.min(cardBottom - box.top + 14, box.height - 6);
            if (stage.closest('.zone.flip')) {
              x1 = box.width - x1; x2 = box.width - x2;
              y1 = box.height - y1; y2 = box.height - y2; dip = box.height - dip;
            }
            svg.setAttribute('viewBox', `0 0 ${box.width} ${box.height}`);
            mask.replaceChildren();
            const maskRect = (x, y, width, height, fill) => {
              const rect = document.createElementNS(svg.namespaceURI, 'rect');
              Object.entries({ x, y, width, height, fill }).forEach(([key, value]) => rect.setAttribute(key, value));
              mask.append(rect);
            };
            maskRect(0, 0, box.width, box.height, 'white');
            stage.querySelectorAll('.sym,.card > .btn').forEach((node) => {
              const r = node.getBoundingClientRect();
              const x = stage.closest('.zone.flip') ? box.right - r.right : r.left - box.left;
              const y = stage.closest('.zone.flip') ? box.bottom - r.bottom : r.top - box.top;
              maskRect(x - 2, y - 2, r.width + 4, r.height + 4, 'black');
            });
            path.setAttribute('d', `M ${x1} ${y1} C ${x1} ${dip}, ${x2} ${dip}, ${x2} ${y2}`);
          }
          draw();
          stage.matchResize = new ResizeObserver(draw); stage.matchResize.observe(stage);
        }
        function deal() {
          if (round >= ROUNDS) return finish();
          round++; locked = false; roundMiss = 0; nextBtn.classList.add('hidden'); reveal.replaceChildren();
          current = pickRound();
          layout(discA, current.a); layout(discB, current.b);
          soloView?.deal();
          renderStatus();
          if (settings.autoSpeak) speak('找一找，兩張卡片哪個語詞一樣？');
          discA.querySelector('.sym').focus();
        }
        function renderStatus() { status.replaceChildren(h('span', {}, `第 ${round} / ${ROUNDS} 回`), h('span', {}, `已練 ${practiced.length} 個詞`)); }
        function pick(it, btn) {
          if (locked) return;
          if (it.text !== current.target.text) {
            misses++; roundMiss++;
            btn.classList.remove('bad'); void btn.offsetWidth; btn.classList.add('bad');
            if (roundMiss === 2) { reveal.replaceChildren(h('div', {}, '💡 線索：先比第一個字，再看後面的字。')); speak('線索，先比第一個字，再看後面的字'); }
            return;
          }
          locked = true;
          document.querySelectorAll('.sym').forEach((s) => { if (s.textContent === it.text) s.classList.add('ok'); });
          showMatch(discA, discB);
          soloView?.markMatch(it.text);
          meaningCheck(it);
        }
        // 找到相同語詞後，再從兩個意思中選一個：確認懂詞義，不只是找相同字
        function meaningCheck(it) {
          const other = shuffle(items.filter((x) => x.meaning !== it.meaning))[0];
          const opts = shuffle([it.meaning, other.meaning]);
          const q = h('div', {}, `找到了「${it.text}」！它的意思是哪一個？`);
          const fb = h('div', { role: 'status' });
          const btns = opts.map((m) => h('button', { class: 'qopt', type: 'button', onclick: (e) => {
            btns.forEach((b) => { b.disabled = true; if (b.textContent === it.meaning) b.classList.add('ok'); });
            const ok = m === it.meaning;
            if (!ok) e.currentTarget.classList.add('bad');
            if (!ok || roundMiss) { again.push({ it, due: round + 3 }); toPractice.push(it.text); }
            practiced.push(it.text);
            fb.textContent = ok ? `✓ 對！「${it.text}」：${it.meaning}` : `一起學：「${it.text}」的意思是「${it.meaning}」`;
            speak(`${it.text}，${it.meaning}`);
            renderStatus();
            nextBtn.classList.remove('hidden'); nextBtn.focus();
          } }, m));
          reveal.replaceChildren(h('div', { class: 'row', style: 'justify-content:center' }, [q, speakBtn(`找到了，${it.text}。它的意思是哪一個？`)]), h('div', { class: 'mcq' }, btns), fb);
          if (settings.autoSpeak) speak(`找到了，${it.text}。它的意思是哪一個？`);
          btns[0].focus();
        }

        // 雙人對戰：兩人各有一組相同的卡。先點對相同語詞、再選對意思的人得 1 分。
        // 點錯語詞停 2 秒；選錯意思這回合出局，另一人還能搶。先得 ROUNDS 分（或打完 ROUNDS×2 回）結束。
        function duel(face) {
          const WIN = ROUNDS;
          const score = [0, 0];
          let rounds = 0;
          const P = [0, 1].map((i) => {
            const discA = h('div', { class: 'disc', role: 'group', 'aria-label': `第${i + 1}位的左卡` });
            const discB = h('div', { class: 'disc', role: 'group', 'aria-label': `第${i + 1}位的右卡` });
            const info = h('div', { class: 'duel-info', role: 'status' });
            const mcq = h('div', { class: 'mcq' });
            const head = h('div', { class: 'duel-head' }, [token(i), h('span', {}, ` 第${i + 1}位`), h('span', { class: 'duel-score' }, '0 分')]);
            const zone = h('section', { class: `zone p${i + 1}${face && i === 0 ? ' flip' : ''}`, 'aria-label': `第${i + 1}位` }, [head,
              h('div', { class: 'stage' }, [h('div', { class: 'card' }, discA), h('div', { class: 'card b' }, discB)]), info, mcq]);
            return { discA, discB, info, mcq, head, zone, state: 'find', frozen: false };
          });
          const center = h('div', { class: 'duel-center' });
          app.replaceChildren(header(bank, '語詞哆寶・雙人對戰'), h('div', { class: `duel${face ? ' face' : ''}` }, [P[0].zone, center, P[1].zone]));
          P.forEach((p) => { p.view = window.RG3D?.mount({ kind: 'dobble', host: p.discA.closest('.stage') }); });
          const setScore = () => P.forEach((p, i) => { p.head.querySelector('.duel-score').textContent = `${score[i]} 分`; });
          function deal() {
            rounds++;
            const r = pickRound();
            current = r;
            center.replaceChildren(h('strong', {}, `第 ${rounds} 回｜先得 ${WIN} 分獲勝`));
            P.forEach((p, i) => {
              p.state = 'find'; p.frozen = false; p.mcq.replaceChildren(); p.info.textContent = '找出兩張卡一樣的語詞！';
              p.zone.classList.remove('won', 'out');
              layout(p.discA, shuffle(r.a), (it, btn) => tap(i, it, btn));
              layout(p.discB, shuffle(r.b), (it, btn) => tap(i, it, btn));
              p.view?.deal();
            });
            if (settings.autoSpeak) speak('預備，開始！');
          }
          function tap(i, it, btn) {
            const p = P[i];
            if (p.state !== 'find' || p.frozen) return;
            if (it.text !== current.target.text) {
              btn.classList.remove('bad'); void btn.offsetWidth; btn.classList.add('bad');
              p.frozen = true; p.info.textContent = '不一樣喔，停 2 秒再找！';
              setTimeout(() => { p.frozen = false; if (p.state === 'find') p.info.textContent = '再找找看！'; }, 2000);
              return;
            }
            p.state = 'meaning';
            p.view?.markMatch(it.text);
            [p.discA, p.discB].forEach((d) => d.querySelectorAll('.sym').forEach((s) => { if (s.textContent === it.text) s.classList.add('ok'); }));
            showMatch(p.discA, p.discB);
            const other = shuffle(items.filter((x) => x.meaning !== it.meaning))[0];
            p.info.textContent = `找到「${it.text}」！它的意思是？`;
            p.mcq.replaceChildren(...shuffle([it.meaning, other.meaning]).map((m) => h('button', { class: 'qopt', type: 'button', onclick: (e) => meaning(i, it, m === it.meaning, e.currentTarget) }, m)));
            p.mcq.querySelector('button')?.focus();
          }
          function meaning(i, it, ok, btn) {
            const p = P[i];
            if (p.state !== 'meaning') return;
            if (!ok) {
              btn.classList.add('bad'); p.state = 'out'; p.zone.classList.add('out');
              p.info.textContent = '意思選錯了，這回合先休息。';
              if (!toPractice.includes(it.text)) toPractice.push(it.text);
              if (P.every((x) => x.state === 'out')) return endRound(-1, it);
              return;
            }
            endRound(i, it);
          }
          function endRound(winner, it) {
            P.forEach((p) => { p.state = 'done'; });
            if (winner >= 0) { score[winner]++; P[winner].zone.classList.add('won'); }
            practiced.push(it.text);
            setScore();
            const msgText = winner >= 0 ? `第${winner + 1}位得分！「${it.text}」：${it.meaning}` : `兩位都再想想：「${it.text}」的意思是「${it.meaning}」`;
            P.forEach((p) => { p.info.textContent = msgText; p.mcq.replaceChildren(); });
            speak(`${it.text}，${it.meaning}`);
            const done = score.some((x) => x >= WIN) || rounds >= WIN * 2;
            const btn = h('button', { class: 'btn primary', type: 'button', onclick: () => (done ? finishDuel() : deal()) }, done ? '看結果' : '下一回');
            center.replaceChildren(btn); btn.focus();
          }
          function finishDuel() {
            P.forEach((p) => p.view?.presentFinish());
            const best = Math.max(...score);
            const winners = [0, 1].filter((i) => score[i] === best);
            center.replaceChildren(
              h('strong', { style: 'font-size:1.3rem' }, winners.length === 2 ? `🤝 平手！${best}：${best}` : `🏆 第${winners[0] + 1}位獲勝！${score[0]}：${score[1]}`),
              h('div', {}, `一起練過：${[...new Set(practiced)].join('、')}`),
              h('button', { class: 'btn primary', type: 'button', onclick: () => location.reload() }, '再玩一次'));
            speak(winners.length === 2 ? '平手！' : `第${winners[0] + 1}位獲勝！`);
          }
          setScore(); deal();
        }
        function finish() {
          const words = [...new Set(practiced)];
          const redo = [...new Set(toPractice)];
          clearMatch(discA.closest('.stage'));
          discA.replaceChildren(); discB.replaceChildren(); soloView?.deal(); soloView?.presentFinish();
          reveal.replaceChildren(
            h('div', {}, `🎉 完成 ${ROUNDS} 回！今天練過：${words.join('、')}`),
            ...(redo.length ? [h('div', {}, `還想再練：${redo.join('、')}`)] : []),
            h('details', { class: 'note' }, [h('summary', {}, '教師詳情'), `點錯 ${misses} 次`]));
          nextBtn.textContent = '再玩一次'; nextBtn.onclick = () => location.reload(); nextBtn.classList.remove('hidden');
          speak(`完成了！今天練了 ${words.length} 個詞`);
        }
        if (modeSel.value !== 'solo') return duel(modeSel.value === 'duel-face');
        soloView = window.RG3D?.mount({ kind: 'dobble', host: discA.closest('.stage') });
        deal();
      }
    }).catch((e) => { document.getElementById('app').textContent = e.message; });
  </script>
</body>
</html>

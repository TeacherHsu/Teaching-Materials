<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>語詞哆寶</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="common.css">
  <style>
    .stage { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin: 12px 0; }
    .disc { position: relative; width: min(440px, 92vw); aspect-ratio: 1; border-radius: 50%; background: #fff; border: 6px solid var(--brand); box-shadow: 0 10px 30px rgba(0,0,0,.12); }
    .disc.b { border-color: var(--c4); }
    .sym { position: absolute; transform: translate(-50%, -50%) rotate(var(--r)); border: none; background: #fff6e8; border-radius: 14px; padding: 4px 10px; font-weight: 900; color: var(--ink); white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,.12); }
    .sym.bad { animation: shake .35s; background: #fbe4e1; }
    .sym.ok { background: #c9f0d6; outline: 4px solid var(--ok); }
    @keyframes shake { 25% { transform: translate(-56%, -50%) rotate(var(--r)); } 75% { transform: translate(-44%, -50%) rotate(var(--r)); } }
    .bar { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; justify-content: center; font-weight: 800; font-size: 1.1rem; }
    .reveal { text-align: center; min-height: 3.4em; font-size: 1.15rem; font-weight: 800; }
  </style>
</head>
<body>
  <main class="wrap" id="app"><p>載入中…</p></main>
  <script src="common.js"></script>
  <script>
    const { h, shuffle, speak, speakBtn, loadBank, setupPanel, header, LEVELS } = RG;
    const SIZE = { support: 4, standard: 6, challenge: 8 };
    const ROUNDS = 10;

    loadBank().then((bank) => {
      const app = document.getElementById('app');
      const { el: panel, settings } = setupPanel(bank, { types: [] });
      app.replaceChildren(header(bank, '語詞哆寶'), panel,
        h('p', { class: 'note' }, '兩張圓卡上只有「一個」語詞完全相同，看到就點它！小心長得很像的字。支持 4 個、標準 6 個、挑戰 8 個語詞（挑戰會加入成語）。每局 10 回。'),
        h('div', { class: 'row' }, h('button', { class: 'btn primary', type: 'button', onclick: () => start() }, '開始遊戲')));

      function start() {
        const k = SIZE[settings.level];
        const items = [
          ...bank.words.filter((w) => settings.lessons.has(w.lesson)).map((w) => ({ text: w.word, meaning: w.meaning, lesson: w.lesson })),
          ...(settings.level === 'challenge' ? bank.idioms.filter((i) => settings.lessons.has(i.lesson)).map((i) => ({ text: i.idiom, meaning: i.definition, lesson: i.lesson })) : []),
        ].filter((x, i, a) => a.findIndex((y) => y.text === x.text) === i);
        if (items.length < k * 2) { alert('勾選的課太少，請多選幾課'); return; }
        let round = 0, score = 0, misses = 0, t0 = Date.now(), current = null, locked = false;
        const discA = h('div', { class: 'disc', role: 'group', 'aria-label': '左邊卡片' });
        const discB = h('div', { class: 'disc b', role: 'group', 'aria-label': '右邊卡片' });
        const status = h('div', { class: 'bar' });
        const reveal = h('div', { class: 'reveal', role: 'status', 'aria-live': 'polite' });
        const nextBtn = h('button', { class: 'btn primary hidden', type: 'button', onclick: () => deal() }, '下一回');
        app.replaceChildren(header(bank, '語詞哆寶'), status, h('div', { class: 'stage' }, [discA, discB]), reveal, h('div', { class: 'row', style: 'justify-content:center' }, nextBtn));

        // 共有字越多越像，優先挑來當干擾，練習分辨形似字
        const overlap = (a, b) => [...a].filter((ch) => b.includes(ch)).length;
        function pickRound() {
          const target = items[Math.floor(Math.random() * items.length)];
          const others = shuffle(items.filter((x) => x.text !== target.text))
            .sort((a, b) => overlap(b.text, target.text) - overlap(a.text, target.text));
          const near = others.slice(0, k);
          const pool = shuffle([...near, ...others.slice(k, k * 3)]).slice(0, (k - 1) * 2);
          return { target, a: shuffle([target, ...pool.slice(0, k - 1)]), b: shuffle([target, ...pool.slice(k - 1)]) };
        }
        function layout(disc, list) {
          disc.replaceChildren();
          const n = list.length;
          list.forEach((it, i) => {
            const center = i === 0 && n > 5;
            const ang = (2 * Math.PI * (center ? 0 : i - (n > 5 ? 1 : 0))) / (n > 5 ? n - 1 : n) + Math.random() * 0.4;
            const rad = center ? 0 : 33;
            const x = 50 + rad * Math.cos(ang), y = 50 + rad * Math.sin(ang);
            const len = it.text.length;
            const fs = (len >= 4 ? 1.05 : 1.45) * (0.85 + Math.random() * 0.35) * (n >= 8 ? 0.85 : 1);
            const b = h('button', { class: 'sym', type: 'button', style: `left:${x}%;top:${y}%;--r:${Math.round(Math.random() * 70 - 35)}deg;font-size:${fs.toFixed(2)}rem`, onclick: (e) => pick(it, e.currentTarget) }, it.text);
            disc.append(b);
          });
        }
        function deal() {
          if (round >= ROUNDS) return finish();
          round++; locked = false; nextBtn.classList.add('hidden'); reveal.textContent = '';
          current = pickRound();
          layout(discA, current.a); layout(discB, current.b);
          renderStatus();
          if (LEVELS[settings.level].autoSpeak) speak('找一找，兩張卡片哪個語詞一樣？');
        }
        function renderStatus() {
          status.replaceChildren(h('span', {}, `第 ${round} / ${ROUNDS} 回`), h('span', {}, `⭐ ${score}`), h('span', {}, `點錯 ${misses} 次`));
        }
        function pick(it, btn) {
          if (locked) return;
          if (it.text !== current.target.text) { misses++; btn.classList.remove('bad'); void btn.offsetWidth; btn.classList.add('bad'); renderStatus(); return; }
          locked = true; score++;
          document.querySelectorAll('.sym').forEach((s) => { if (s.textContent === it.text) s.classList.add('ok'); });
          reveal.replaceChildren(h('div', {}, `找到了！「${it.text}」：${it.meaning}（第${it.lesson}課）`), speakBtn(`${it.text}，${it.meaning}`));
          speak(`${it.text}，${it.meaning}`);
          renderStatus();
          nextBtn.classList.remove('hidden'); nextBtn.focus();
        }
        function finish() {
          const sec = Math.round((Date.now() - t0) / 1000);
          reveal.replaceChildren(h('div', {}, `🎉 完成 ${ROUNDS} 回！用時 ${sec} 秒，點錯 ${misses} 次。`));
          discA.replaceChildren(); discB.replaceChildren();
          nextBtn.textContent = '再玩一次'; nextBtn.onclick = () => location.reload(); nextBtn.classList.remove('hidden');
          speak(`完成了！用了 ${sec} 秒`);
        }
        deal();
      }
    }).catch((e) => { document.getElementById('app').textContent = e.message; });
  </script>
</body>
</html>

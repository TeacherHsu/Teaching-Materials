<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="115 國語課文點讀教材課次索引，共 53 課。">
  <title>115 國語課文點讀｜53 課索引</title>
  <style>
    :root {
      --ink: #233044;
      --muted: #66758a;
      --line: #dce5ef;
      --paper: #ffffff;
      --wash: #f4f8fc;
      --teal: #0f766e;
      --teal-soft: #e6f7f4;
      --blue: #2563eb;
      --shadow: 0 18px 45px rgba(35, 48, 68, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: linear-gradient(145deg, #eef7f8 0%, var(--wash) 42%, #f8f6ff 100%);
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      line-height: 1.6;
    }
    a { color: inherit; }
    .shell { width: min(1080px, calc(100% - 32px)); margin: 0 auto; padding: 42px 0 56px; }
    .hero {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      align-items: end;
      margin-bottom: 28px;
    }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--teal);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(2rem, 5vw, 3.5rem); line-height: 1.12; letter-spacing: -.04em; }
    .lead { max-width: 640px; margin: 14px 0 0; color: var(--muted); font-size: 1.05rem; }
    .summary {
      min-width: 156px;
      padding: 16px 18px;
      border: 1px solid rgba(15, 118, 110, .16);
      border-radius: 18px;
      background: rgba(255, 255, 255, .72);
      box-shadow: var(--shadow);
      text-align: center;
    }
    .summary strong { display: block; color: var(--teal); font-size: 2rem; line-height: 1; }
    .summary span { color: var(--muted); font-size: .86rem; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin: 0 0 28px;
      padding: 14px;
      border: 1px solid rgba(220, 229, 239, .9);
      border-radius: 18px;
      background: rgba(255, 255, 255, .76);
      box-shadow: 0 10px 28px rgba(35, 48, 68, .05);
    }
    .search {
      flex: 1 1 280px;
      min-width: 180px;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--ink);
      background: var(--paper);
      font: inherit;
      outline: none;
    }
    .search:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(15, 118, 110, .12); }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; }
    .filter {
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: var(--paper);
      font: inherit;
      font-size: .88rem;
      cursor: pointer;
    }
    .filter:hover, .filter[aria-pressed="true"] { color: var(--teal); border-color: #8fd6ce; background: var(--teal-soft); }
    #result-count { margin-left: auto; color: var(--muted); font-size: .86rem; white-space: nowrap; }
    .group { margin: 0 0 28px; }
    .group-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 0 0 12px; }
    .group-heading h2 { margin: 0; font-size: 1.2rem; }
    .group-heading span { color: var(--muted); font-size: .85rem; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
    .card {
      display: flex;
      min-height: 118px;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      padding: 17px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 255, 255, .9);
      box-shadow: 0 8px 22px rgba(35, 48, 68, .045);
      text-decoration: none;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .card:hover { transform: translateY(-3px); border-color: #91d7d0; box-shadow: var(--shadow); }
    .tag { color: var(--teal); font-size: .78rem; font-weight: 800; letter-spacing: .04em; }
    .card h3 { margin: 4px 0 0; font-size: 1.08rem; line-height: 1.35; }
    .open { align-self: flex-start; color: var(--blue); font-size: .8rem; font-weight: 700; }
    .empty { padding: 36px 18px; border: 1px dashed var(--line); border-radius: 16px; color: var(--muted); text-align: center; }
    footer { margin-top: 38px; padding-top: 20px; border-top: 1px solid rgba(220, 229, 239, .9); color: var(--muted); font-size: .82rem; text-align: center; }
    footer a { color: var(--teal); font-weight: 700; text-decoration: none; }
    @media (max-width: 680px) {
      .shell { width: min(100% - 22px, 1080px); padding-top: 26px; }
      .hero { grid-template-columns: 1fr; }
      .summary { justify-self: start; min-width: 138px; }
      #result-count { width: 100%; margin-left: 0; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Reading Tool · 115 國語教材</p>
        <h1>53 課課文點讀</h1>
        <p class="lead">選一課即可開始「讀字、讀詞、讀句」練習。課次連結直接開啟正式教材，注音、斷詞與 TTS 校正會沿用最新版本。</p>
      </div>
      <div class="summary" aria-label="課次總數"><strong id="total">53</strong><span>正式課次</span></div>
    </header>

    <section class="toolbar" aria-label="課次搜尋與篩選">
      <input id="search" class="search" type="search" placeholder="搜尋課名或課次，例如：一會兒、L07、回音" aria-label="搜尋課名或課次">
      <div id="filters" class="filters" role="group" aria-label="教材版本"></div>
      <span id="result-count" aria-live="polite"></span>
    </section>

    <section id="lesson-list" aria-live="polite"></section>

    <footer>
      <a href="./index.html">返回課文點讀工具</a>
      <span> · </span>
      <span>資料來源：catalog.json · 僅供教育學習使用</span>
    </footer>
  </main>

  <script>
    // Generated from catalog.json. Keep lesson IDs and titles aligned with the catalog.
    const lessons = [{"lesson_id":"115HG0A01","title":"115G1A 翰版首冊 L01：手拉手","path":"lessons/115HG0A01.json"},{"lesson_id":"115HG0A02","title":"115G1A 翰版首冊 L02：排一排","path":"lessons/115HG0A02.json"},{"lesson_id":"115HG0A03","title":"115G1A 翰版首冊 L03：來數數","path":"lessons/115HG0A03.json"},{"lesson_id":"115HG0A04","title":"115G1A 翰版首冊 L04：找一找","path":"lessons/115HG0A04.json"},{"lesson_id":"115HG0A05","title":"115G1A 翰版首冊 L05：雨來了","path":"lessons/115HG0A05.json"},{"lesson_id":"115HG0A06","title":"115G1A 翰版首冊 L06：山坡上的學校","path":"lessons/115HG0A06.json"},{"lesson_id":"115HG0A07","title":"115G1A 翰版首冊 L07：值日生","path":"lessons/115HG0A07.json"},{"lesson_id":"115HG0A08","title":"115G1A 翰版首冊 L08：運動會","path":"lessons/115HG0A08.json"},{"lesson_id":"115HG0A09","title":"115G1A 翰版首冊 L09：做卡片","path":"lessons/115HG0A09.json"},{"lesson_id":"115HG0AR01","title":"115G1A 翰版首冊：來閱讀〈紙飛機〉","path":"lessons/115HG0AR01.json"},{"lesson_id":"115HG1A01","title":"115G1A 翰版第一冊 L01：一起走","path":"lessons/115HG1A01.json"},{"lesson_id":"115HG1A02","title":"115G1A 翰版第一冊 L02：大風吹","path":"lessons/115HG1A02.json"},{"lesson_id":"115HG1A03","title":"115G1A 翰版第一冊 L03：火車過山洞","path":"lessons/115HG1A03.json"},{"lesson_id":"115HG1A04","title":"115G1A 翰版第一冊 L04：請問","path":"lessons/115HG1A04.json"},{"lesson_id":"115HG1A05","title":"115G1A 翰版第一冊 L05：七彩的滑梯","path":"lessons/115HG1A05.json"},{"lesson_id":"115KG4A01","title":"115G4A 康版第七冊 L01：水陸小高手","path":"lessons/115KG4A01.json"},{"lesson_id":"115KG4A02","title":"115G4A 康版第七冊 L02：放學後","path":"lessons/115KG4A02.json"},{"lesson_id":"115KG4A03","title":"115G4A 康版第七冊 L03：我的籃球夢","path":"lessons/115KG4A03.json"},{"lesson_id":"115KG4A04","title":"115G4A 康版第七冊 L04：永遠的馬偕","path":"lessons/115KG4A04.json"},{"lesson_id":"115KG4A05","title":"115G4A 康版第七冊 L05：假如給我三天光明","path":"lessons/115KG4A05.json"},{"lesson_id":"115KG4A06","title":"115G4A 康版第七冊 L06：攀登生命的高峰","path":"lessons/115KG4A06.json"},{"lesson_id":"115HG1A06","title":"115G1A 翰版第一冊 L06：秋千","path":"lessons/115HG1A06.json"},{"lesson_id":"115HG1A07","title":"115G1A 翰版第一冊 L07：回音","path":"lessons/115HG1A07.json"},{"lesson_id":"115HG2A01","title":"115G2A 翰版第三冊 L01：我的心情","path":"lessons/115HG2A01.json"},{"lesson_id":"115HG2A02","title":"115G2A 翰版第三冊 L02：彩色的天空","path":"lessons/115HG2A02.json"},{"lesson_id":"115HG2A03","title":"115G2A 翰版第三冊 L03：國王做新衣","path":"lessons/115HG2A03.json"},{"lesson_id":"115HG2A04","title":"115G2A 翰版第三冊 L04：水草下的呱呱","path":"lessons/115HG2A04.json"},{"lesson_id":"115HG2A05","title":"115G2A 翰版第三冊 L05：沙灘上的畫","path":"lessons/115HG2A05.json"},{"lesson_id":"115HG2A06","title":"115G2A 翰版第三冊 L06：草叢裡的星星","path":"lessons/115HG2A06.json"},{"lesson_id":"115HG2A07","title":"115G2A 翰版第三冊 L07：不一樣的美食","path":"lessons/115HG2A07.json"},{"lesson_id":"115HG2A08","title":"115G2A 翰版第三冊 L08：美食分享日","path":"lessons/115HG2A08.json"},{"lesson_id":"115HG2A09","title":"115G2A 翰版第三冊 L09：好味道","path":"lessons/115HG2A09.json"},{"lesson_id":"115HG2A10","title":"115G2A 翰版第三冊 L10：加加減減","path":"lessons/115HG2A10.json"},{"lesson_id":"115HG2A11","title":"115G2A 翰版第三冊 L11：奇怪的門","path":"lessons/115HG2A11.json"},{"lesson_id":"115HG2A12","title":"115G2A 翰版第三冊 L12：詠鵝","path":"lessons/115HG2A12.json"},{"lesson_id":"115KG4A07","title":"115G4A 康版第七冊 L07：美味的一堂課","path":"lessons/115KG4A07.json"},{"lesson_id":"115KG4A08","title":"115G4A 康版第七冊 L08：建築界的長頸鹿","path":"lessons/115KG4A08.json"},{"lesson_id":"115KG4A09","title":"115G4A 康版第七冊 L09：請到我的家鄉來","path":"lessons/115KG4A09.json"},{"lesson_id":"115KG4A10","title":"115G4A 康版第七冊 L10：奇幻旋律","path":"lessons/115KG4A10.json"},{"lesson_id":"115KG4A11","title":"115G4A 康版第七冊 L11：兔子先生等等我","path":"lessons/115KG4A11.json"},{"lesson_id":"115KG4A12","title":"115G4A 康版第七冊 L12：老鞋匠和小精靈","path":"lessons/115KG4A12.json"},{"lesson_id":"115HG6A01","title":"115G6A 翰版第十一冊 L01：遇見自己","path":"lessons/115HG6A01.json"},{"lesson_id":"115HG6A02","title":"115G6A 翰版第十一冊 L02：為什麼大家不理我？","path":"lessons/115HG6A02.json"},{"lesson_id":"115HG6A03","title":"115G6A 翰版第十一冊 L03：孔子說的話","path":"lessons/115HG6A03.json"},{"lesson_id":"115HG6A04","title":"115G6A 翰版第十一冊 L04：向大自然學習","path":"lessons/115HG6A04.json"},{"lesson_id":"115HG6A05","title":"115G6A 翰版第十一冊 L05：樹的聯想","path":"lessons/115HG6A05.json"},{"lesson_id":"115HG6A06","title":"115G6A 翰版第十一冊 L06：善用自嘲，展現幽默","path":"lessons/115HG6A06.json"},{"lesson_id":"115HG6A07","title":"115G6A 翰版第十一冊 L07：跟著公共藝術去旅行","path":"lessons/115HG6A07.json"},{"lesson_id":"115HG6A08","title":"115G6A 翰版第十一冊 L08：街頭藝術家","path":"lessons/115HG6A08.json"},{"lesson_id":"115HG6A09","title":"115G6A 翰版第十一冊 L09：戲臺上的她與他","path":"lessons/115HG6A09.json"},{"lesson_id":"115HG6A10","title":"115G6A 翰版第十一冊 L10：過故人莊","path":"lessons/115HG6A10.json"},{"lesson_id":"115HG6A11","title":"115G6A 翰版第十一冊 L11：來一碗溫暖的羹湯","path":"lessons/115HG6A11.json"},{"lesson_id":"115HG6A12","title":"115G6A 翰版第十一冊 L12：存根","path":"lessons/115HG6A12.json"}];

    const state = { query: "", book: "全部" };
    const search = document.querySelector("#search");
    const filters = document.querySelector("#filters");
    const list = document.querySelector("#lesson-list");
    const resultCount = document.querySelector("#result-count");
    const total = document.querySelector("#total");

    const parseLesson = (lesson) => {
      const colon = lesson.title.indexOf("：");
      const prefix = colon >= 0 ? lesson.title.slice(0, colon).trim() : lesson.title;
      const title = colon >= 0 ? lesson.title.slice(colon + 1).replace(/[〈〉]/g, "").trim() : lesson.title;
      const book = prefix.replace(/\s+L\d+$/, "").trim();
      const label = prefix === book ? "來閱讀" : prefix.slice(book.length).trim();
      return { ...lesson, book, label, lessonTitle: title };
    };

    const parsed = lessons.map(parseLesson);
    const books = ["全部", ...new Set(parsed.map((lesson) => lesson.book))];
    total.textContent = parsed.length;

    const renderFilters = () => {
      filters.innerHTML = books.map((book) =>
        `<button class="filter" type="button" aria-pressed="${state.book === book}" data-book="${book}">${book}</button>`
      ).join("");
      filters.querySelectorAll("[data-book]").forEach((button) => {
        button.addEventListener("click", () => {
          state.book = button.dataset.book;
          render();
        });
      });
    };

    const matches = (lesson) => {
      const q = state.query.trim().toLowerCase();
      return (!q || [lesson.lesson_id, lesson.title, lesson.book, lesson.lessonTitle].join(" ").toLowerCase().includes(q))
        && (state.book === "全部" || lesson.book === state.book);
    };

    const render = () => {
      renderFilters();
      const visible = parsed.filter(matches);
      resultCount.textContent = visible.length === parsed.length ? `共 ${parsed.length} 課` : `顯示 ${visible.length} / ${parsed.length} 課`;
      if (!visible.length) {
        list.innerHTML = '<div class="empty">找不到符合條件的課次，請換一個關鍵字。</div>';
        return;
      }
      const groups = visible.reduce((map, lesson) => {
        (map[lesson.book] ||= []).push(lesson);
        return map;
      }, {});
      list.innerHTML = Object.entries(groups).map(([book, group]) => `
        <section class="group" aria-labelledby="group-${book}">
          <div class="group-heading"><h2 id="group-${book}">${book}</h2><span>${group.length} 課</span></div>
          <div class="cards">
            ${group.map((lesson) => `
              <a class="card" href="./index.html?lesson=${encodeURIComponent(lesson.lesson_id)}">
                <div><div class="tag">${lesson.label}</div><h3>${lesson.lessonTitle}</h3></div>
                <span class="open">開啟點讀 →</span>
              </a>
            `).join("")}
          </div>
        </section>
      `).join("");
    };

    search.addEventListener("input", (event) => {
      state.query = event.target.value;
      render();
    });
    render();
  </script>
</body>
